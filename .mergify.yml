# Self-contained (no `extends:` pulling in a shared/reusable config) --
# propagation is a public repo, and an externally-sourced config's real
# content renders into THIS repo's own public Action logs when it's pulled
# in, which would leak incident history or other detail embedded in a
# shared config's own comments (some of which may live in a private repo)
# straight onto a public log. This file's own comments stay generic for
# the same reason -- no references to other repos, named or otherwise.
#
# Mergify's rule-action only re-fires when a condition transitions from
# unmatched to matched -- a static condition list (base=main, -draft,
# -closed alone) that's already true the instant a PR opens fires once,
# immediately, and never gets a second chance once checks later go green.
# The check-success/#review-threads-unresolved conditions below give the
# rule something stateful to re-trigger on.
#
# The check-skipped OR-clauses (on `Wait for Codex Review` and `Codex
# review clean (gate before test)`) are needed because wait-for-codex.yml
# and the codex-clean gate job both deliberately skip for dependabot[bot]/
# draft/non-pull_request events -- without them, those PRs would never
# auto-queue. `test` and `Wiki lint` have no legitimate skip path of their
# own (test only reports non-success when codex-clean genuinely failed,
# which must NOT be treated as merge-eligible) and stay plain
# check-success conditions.
#
# Trusted-author gate: `thagale` and `dependabot[bot]` are the only two
# authors that can ever auto-queue -- this repo is public, its ruleset has
# `required_approving_review_count: 0`, and the native auto-merge workflow
# this queue replaces had NO author-association check of its own to carry
# forward -- without this, any outside contributor's PR that goes green on
# all three required checks would auto-queue and merge with zero human in
# the loop. Mergify has no direct equivalent of GitHub's
# `author_association` (no built-in role/collaborator lookup), only an
# exact-login match, so `author = thagale` is the closest available
# primitive. This diverges the moment a second trusted human collaborator
# is added -- their PRs won't auto-queue under a single-login condition and
# will need either a manual `@Mergifyio queue` comment or a new rule added
# with their login.
#
# The two authors get SEPARATE rules below, not one shared rule, because
# they need different admission tests. `needs-review` is only ever applied
# by dependabot-auto-merge.yml (major-version bumps), so the thagale rule
# carries no needs-review condition at all -- it was never a meaningful
# gate for a human-authored PR. The dependabot rule instead requires the
# PRESENCE of a positive `dependabot-vetted` label, applied by
# dependabot-auto-merge.yml only after it classifies a PR as minor/patch
# and auto-approves it. The single shared rule this replaced admitted
# dependabot[bot] on the ABSENCE of `needs-review`, which is satisfied by
# default before the labeling workflow has even run -- if that workflow is
# delayed, or fails partway through (before reaching the `needs-review`
# step, which lives in a LATER, separate step from the metadata fetch), an
# unvetted major-version Dependabot bump would satisfy `-label =
# needs-review` and queue having never been reviewed at all. Requiring the
# positive `dependabot-vetted` label instead means a stalled or failed
# labeling run simply leaves the PR unqueued -- it fails closed, not open.
queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    update_method: rebase
    merge_conditions:
      - "#review-threads-unresolved = 0"
      - check-success = Wiki lint
      - check-success = test
      - or:
          - check-success = Wait for Codex Review
          - check-skipped = Wait for Codex Review
      - or:
          - check-success = Codex review clean (gate before test)
          - check-skipped = Codex review clean (gate before test)
      # Both pull_request_rules above feed the SAME queue, so this list
      # can't unconditionally require `dependabot-vetted` -- that would
      # also block every thagale-authored PR, which never gets that label.
      # Scoped to dependabot[bot] specifically: if a queued minor/patch
      # bump is reclassified to major mid-queue, dependabot-auto-merge.yml
      # removes the label (see its own major-update step) -- this
      # condition then stops matching, continuously (not just at entry),
      # so the reclassified revision can no longer merge even after its
      # new checks pass.
      - or:
          - "-author = dependabot[bot]"
          - label = dependabot-vetted

pull_request_rules:
  - name: queue on green + threads resolved (thagale)
    conditions:
      - base = main
      - -draft
      - -closed
      - author = thagale
      - "#review-threads-unresolved = 0"
      - check-success = Wiki lint
      - check-success = test
      - or:
          - check-success = Wait for Codex Review
          - check-skipped = Wait for Codex Review
      - or:
          - check-success = Codex review clean (gate before test)
          - check-skipped = Codex review clean (gate before test)
    actions:
      queue:
        name: default

  # dependabot[bot] gets its OWN rule requiring an explicit positive
  # `dependabot-vetted` label (applied by dependabot-auto-merge.yml only
  # for minor/patch updates) rather than sharing the old shared rule's
  # `-label = needs-review` exclusion -- absence of a negative label is
  # satisfied by default if the labeling workflow hasn't run yet or fails,
  # which would let an unvetted major-version bump queue; requiring a
  # POSITIVE signal fails closed instead.
  - name: queue on green + threads resolved (dependabot, vetted only)
    conditions:
      - base = main
      - -draft
      - -closed
      - author = dependabot[bot]
      - label = dependabot-vetted
      - "#review-threads-unresolved = 0"
      - check-success = Wiki lint
      - check-success = test
      - or:
          - check-success = Wait for Codex Review
          - check-skipped = Wait for Codex Review
      - or:
          - check-success = Codex review clean (gate before test)
          - check-skipped = Codex review clean (gate before test)
    actions:
      queue:
        name: default
