[project]
name = "propagation"
version = "0.1.0"
description = "ML-based HF propagation nowcasting"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = [
    "duckdb>=1.0",
    "polars>=1.9",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.0",
    "dxentity>=0.1.9",
    "paho-mqtt>=2.1",
]

[project.scripts]
build-p533 = "propagation.models.p533_build:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["baselines/p533/upstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propagation"]
