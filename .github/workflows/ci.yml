name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Build vendored ITURHFProp
        run: uv run build-p533
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q
