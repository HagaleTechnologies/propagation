name: Wiki lint
on:
  push:
    branches: [main]
    paths: ['wiki/**']
  pull_request:
    paths: ['wiki/**']
jobs:
  wiki-lint:
    name: Wiki lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Clone sunto
        run: git clone https://github.com/HagaleTechnologies/sunto.git /tmp/sunto
      - name: Lint wiki
        run: python3 /tmp/sunto/bin/wiki-lint wiki/
