name: Wiki lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  wiki-lint:
    name: Wiki lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Lint wiki
        uses: HagaleTechnologies/sunto@v1
        with:
          path: wiki/
