name: Dependabot Auto-Merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write
  # gh label create (in the "Mark minor/patch update as vetted" step
  # below) needs Issues:write on GitHub's Create-a-label endpoint --
  # without it the call 403s, hidden by the step's own `|| true`.
  issues: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # dependabot/fetch-metadata outputs are safe (controlled by GitHub, not user input)
      - name: Auto-approve minor/patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved: ${UPDATE_TYPE} update for ${DEP_NAMES}"

      # Positive signal, not a negative exclusion: the Mergify queue rule
      # for dependabot[bot] requires THIS label to be present, rather than
      # relying on `needs-review`'s absence -- if this workflow is delayed
      # or fails before reaching this step, the PR simply never gets
      # vetted and never queues, instead of queueing by default.
      - name: Mark minor/patch update as vetted for the Mergify queue
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "dependabot-vetted" --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Required by .mergify.yml's dependabot queue rule; applied for minor/patch bumps only" \
            >/dev/null 2>&1 || true
          gh pr edit "$PR_URL" --add-label "dependabot-vetted"

      - name: Label major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PREV_VER: ${{ steps.metadata.outputs.previous-version }}
          NEW_VER: ${{ steps.metadata.outputs.new-version }}
        run: |
          # A grouped update can be reclassified from minor/patch to major
          # on a later Dependabot refresh of the SAME PR -- remove any
          # stale positive vetting signal from an earlier classification,
          # or the PR could still satisfy Mergify's dependabot rule despite
          # no longer being minor/patch. Unlike --add-label, gh pr edit
          # --remove-label on a label that doesn't exist YET on the repo
          # (e.g. the very first Dependabot PR ever happens to be major, so
          # the minor/patch step above never ran) errors out -- which,
          # under GitHub Actions' default `bash -e`, would abort this step
          # before major-update/needs-review ever gets applied. Create the
          # label defensively here too (idempotent, same as the minor/patch
          # step) so it's guaranteed to exist before either path touches it.
          gh label create "dependabot-vetted" --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Required by .mergify.yml's dependabot queue rule; applied for minor/patch bumps only" \
            >/dev/null 2>&1 || true
          gh pr edit "$PR_URL" --add-label "major-update,needs-review" --remove-label "dependabot-vetted"
          gh pr comment "$PR_URL" --body "Major version bump: ${DEP_NAMES} (${PREV_VER} -> ${NEW_VER}). Requires manual review before merge."
