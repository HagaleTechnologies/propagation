name: Dependabot Auto-Merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write
  # gh label create (in the "Mark minor/patch update as vetted" step
  # below) needs Issues:write on GitHub's Create-a-label endpoint --
  # without it the call 403s, hidden by the step's own `|| true`.
  issues: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Shared with auto-merge-trigger.yml's and queue-retry-handler.yml's own mutating jobs
    # (Codex P1, round 2 of this PR): this job's inline admission/disarm steps below are real
    # mutations of the same PR's auto-merge/queue state those other jobs also mutate -- without
    # the shared lock, a TOCTOU race is possible (e.g. this job reads needs-human as absent and
    # arms moments after auto-merge-trigger.yml disarmed for that exact reason).
    # cancel-in-progress: false: a queued run must WAIT for the current holder to finish its
    # full read-decide-act sequence, never cancel it mid-mutation.
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # dependabot/fetch-metadata outputs are safe (controlled by GitHub, not user input)
      - name: Auto-approve minor/patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved: ${UPDATE_TYPE} update for ${DEP_NAMES}"

      # Positive signal, not a negative exclusion: the native-queue admission gate for
      # dependabot[bot] requires THIS label to be present, rather than relying on
      # `needs-review`'s absence -- if this workflow is delayed or fails before reaching this
      # step, the PR simply never gets vetted and never queues, instead of queueing by default.
      - name: Mark minor/patch update as vetted
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "dependabot-vetted" --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Required by auto-merge-trigger.yml's dependabot admission gate; applied for minor/patch bumps only" \
            >/dev/null 2>&1 || true
          gh pr edit "$PR_URL" --add-label "dependabot-vetted"

      # Admit inline, right here, rather than relying on auto-merge-trigger.yml's own
      # `labeled: dependabot-vetted` trigger to pick this up (Codex P1, found reviewing this
      # PR): the label edit above runs with `secrets.GITHUB_TOKEN`, and GitHub's anti-recursion
      # guard means an event authored by the default GITHUB_TOKEN does NOT trigger other
      # workflow runs -- auto-merge-trigger.yml's `labeled`/`unlabeled` handling for
      # dependabot-vetted is a defensive fallback for the rare case where a LATER genuine
      # dependabot push (a real `synchronize` event, not GITHUB_TOKEN-authored) happens to see
      # this label already present; it is NOT the primary mechanism, and cannot be, since this
      # label mutation itself will never trigger it. This inline call is what actually performs
      # first-time admission for the overwhelmingly common case (this vetting step being the
      # PR's own most recent event).
      #
      # GITHUB_TOKEN, not CODEX_REVIEW_PAT: this job is itself triggered by a dependabot-actor
      # event, and wait-for-codex.yml's own header comment documents that GitHub withholds
      # custom Actions secrets (CODEX_REVIEW_PAT included) for any workflow run triggered by
      # dependabot[bot] -- CODEX_REVIEW_PAT expands to empty here, so using it would fail auth
      # for every single Dependabot PR. GITHUB_TOKEN is proven to work in this exact trigger
      # context already (the approve/label steps above already write successfully with it).
      # This does mean the eventual merge-queue commit may be attributed to GITHUB_TOKEN rather
      # than CODEX_REVIEW_PAT, unlike the thagale/catalyst-cloud-connector[bot] admission path
      # in auto-merge-trigger.yml -- accepted the same way this workflow's own approve/label
      # actions already accept it, since no other credential is available here at all.
      - name: Admit the vetted PR to the native merge queue
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # The head fetch-metadata actually classified -- see --match-head-commit below.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fail-closed disarm-and-verify, reused by the needs-human branch below (Codex P1,
          # round 3): a pending-run eviction (GitHub retains only one pending run per
          # concurrency group) can replace the labeled event's own disarm run before it
          # executes -- this run, observing the pause live, may be the one actually positioned
          # to finish that disarm, so it must not just stand down silently. Mirrors
          # auto-merge-trigger.yml's still_armed_or_queued()-based disarm exactly.
          disarm_dequeue_and_verify_or_fail() {
            local reason="$1"
            gh pr merge "$PR_URL" --disable-auto >/dev/null 2>&1 || true
            local queue_state pr_node_id in_queue
            queue_state=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) { pullRequest(number: $pr) { id isInMergeQueue } }
              }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$PR" 2>/dev/null)
            pr_node_id=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.id' 2>/dev/null)
            in_queue=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.isInMergeQueue' 2>/dev/null)
            if [ "$in_queue" = "true" ] && [ -n "$pr_node_id" ] && [ "$pr_node_id" != "null" ]; then
              echo "::notice::PR #$PR is in the native merge queue -- dequeuing ($reason)."
              gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$pr_node_id" >/dev/null 2>&1 || true
            fi
            local state armed queued
            state=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) { pullRequest(number: $pr) { autoMergeRequest { enabledAt } isInMergeQueue } }
              }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$PR" 2>/dev/null)
            armed=$(printf '%s' "$state" | jq -r '.data.repository.pullRequest.autoMergeRequest != null' 2>/dev/null)
            queued=$(printf '%s' "$state" | jq -r '.data.repository.pullRequest.isInMergeQueue' 2>/dev/null)
            if { [ "$armed" != "true" ] && [ "$armed" != "false" ]; } || { [ "$queued" != "true" ] && [ "$queued" != "false" ]; }; then
              echo "::error::Could not confirm PR #$PR's armed/queued state ($reason) -- treating as unsafe (fail closed)." >&2
              return 1
            fi
            if [ "$armed" = "true" ] || [ "$queued" = "true" ]; then
              echo "::error::PR #$PR is STILL ARMED and/or still in the merge queue (armed: $armed, queued: $queued) despite disable-auto/dequeue ($reason)." >&2
              return 1
            fi
            return 0
          }

          # needs-human check (Codex P1, round 2; disarm added round 3): a manually-applied
          # pause must not be silently overridden by a later synchronize event that happens to
          # re-vet the PR -- this is a LIVE fetch, not the webhook-delivery-time labels
          # snapshot, matching auto-merge-trigger.yml's own needs-human check. If this run
          # observes the pause live, it actively disarms/dequeues rather than just standing
          # down -- see the pending-run-eviction rationale on disarm_dequeue_and_verify_or_fail
          # above.
          current_labels=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
          if grep -qxF "needs-human" <<< "$current_labels"; then
            echo "::notice::PR #$PR has needs-human attached -- ensuring auto-merge is not armed/queued despite passing dependabot vetting."
            disarm_dequeue_and_verify_or_fail "needs-human observed during dependabot admission" || exit 1
            exit 0
          fi
          merge_queue_live=$(gh api "repos/${REPO}/rules/branches/main" --jq '[.[] | select(.type == "merge_queue")] | length > 0' 2>/dev/null || echo false)
          if [ "$merge_queue_live" != "true" ]; then
            echo "::notice::No merge_queue ruleset rule exists yet for main -- standing down without arming native auto-merge. Mergify's own queue is still the sole merge authority until the ruleset update lands."
            exit 0
          fi
          current_base=$(gh pr view "$PR_URL" --json baseRefName --jq .baseRefName)
          if [ "$current_base" != "main" ]; then
            echo "::notice::PR's base is '$current_base' (not main) as of this mutation attempt -- standing down without arming auto-merge."
            exit 0
          fi
          # --match-head-commit pins this call to the exact head fetch-metadata classified
          # (Codex P1, round 7): this job holds the shared auto-merge-<PR> lock, but a second
          # Dependabot push queues its OWN job in the same group and waits its turn -- by the
          # time this run reaches this call, a newer, differently-classified revision could
          # already be the PR's live head. Without pinning, `gh pr merge "$PR_URL"` acts on
          # whatever the CURRENT head is, letting a stale minor/patch classification arm a
          # revision that's actually major. If the head has moved, this fails outright rather
          # than silently admitting the wrong revision -- the new push's own run (already
          # queued behind this one) re-classifies and re-evaluates it correctly.
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"

      - name: Label major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PREV_VER: ${{ steps.metadata.outputs.previous-version }}
          NEW_VER: ${{ steps.metadata.outputs.new-version }}
        run: |
          # A grouped update can be reclassified from minor/patch to major
          # on a later Dependabot refresh of the SAME PR -- remove any
          # stale positive vetting signal from an earlier classification,
          # or the PR could still satisfy the native admission gate despite
          # no longer being minor/patch. Unlike --add-label, gh pr edit
          # --remove-label on a label that doesn't exist YET on the repo
          # (e.g. the very first Dependabot PR ever happens to be major, so
          # the minor/patch step above never ran) errors out -- which,
          # under GitHub Actions' default `bash -e`, would abort this step
          # before major-update/needs-review ever gets applied. Create the
          # label defensively here too (idempotent, same as the minor/patch
          # step) so it's guaranteed to exist before either path touches it.
          gh label create "dependabot-vetted" --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Required by auto-merge-trigger.yml's dependabot admission gate; applied for minor/patch bumps only" \
            >/dev/null 2>&1 || true
          gh pr edit "$PR_URL" --add-label "major-update,needs-review" --remove-label "dependabot-vetted"
          gh pr comment "$PR_URL" --body "Major version bump: ${DEP_NAMES} (${PREV_VER} -> ${NEW_VER}). Requires manual review before merge."

      # Disarm inline, right here, for the exact same reason the admission step above is
      # inline (Codex P1, found reviewing this PR): the label removal above runs with
      # GITHUB_TOKEN, so it can never trigger auto-merge-trigger.yml's own `unlabeled:
      # dependabot-vetted` handling. Without this, a Dependabot PR that was admitted while
      # vetted, then reclassified to major mid-queue (a grouped update's later refresh),
      # would stay armed or queued indefinitely despite no longer being trusted -- exactly the
      # security gap the continuous re-check exists to close.
      #
      # always() is required, not optional decoration (Codex P1, round 4): GitHub Actions
      # applies a default guard that auto-skips a step whenever a PRIOR step in the same job
      # failed, regardless of this step's own `if:` -- unless that `if:` includes a
      # status-check function. The preceding "Label major updates for review" step can fail
      # PARTIALLY (its own `gh pr edit --remove-label dependabot-vetted` call succeeds, then
      # `gh pr comment` fails under `bash -e`, reporting the whole step as failed) -- without
      # always() here, this disarm step would then be skipped entirely, leaving a PR that just
      # lost its vetting label still armed or queued. Same class of bug already documented and
      # fixed in ci.yml's own test/wiki-lint jobs.
      - name: Disarm/dequeue the reclassified PR
        if: always() && steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Fail-closed verification (Codex P1, round 2): the original version discarded
          # --disable-auto's own failure (`|| true`) and only re-checked isInMergeQueue, not
          # autoMergeRequest -- a transient/permission failure on the disable-auto call could
          # leave the PR armed (not queued yet), and this step would still report success. Same
          # verify-both-states-or-fail-closed pattern as auto-merge-trigger.yml's own
          # still_armed_or_queued().
          OWNER_PART="${REPO%%/*}"; NAME_PART="${REPO##*/}"
          gh pr merge "$PR_URL" --disable-auto >/dev/null 2>&1 || true
          queue_state=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) { id isInMergeQueue }
              }
            }' -f owner="$OWNER_PART" -f name="$NAME_PART" -F pr="$PR" 2>/dev/null)
          pr_node_id=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.id')
          in_queue=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.isInMergeQueue')
          if [ "$in_queue" = "true" ] && [ -n "$pr_node_id" ] && [ "$pr_node_id" != "null" ]; then
            echo "::notice::PR #$PR is in the native merge queue -- dequeuing after reclassification to major."
            gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$pr_node_id" >/dev/null 2>&1 || true
          fi

          state=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) { autoMergeRequest { enabledAt } isInMergeQueue }
              }
            }' -f owner="$OWNER_PART" -f name="$NAME_PART" -F pr="$PR" 2>/dev/null)
          armed=$(printf '%s' "$state" | jq -r '.data.repository.pullRequest.autoMergeRequest != null' 2>/dev/null)
          queued=$(printf '%s' "$state" | jq -r '.data.repository.pullRequest.isInMergeQueue' 2>/dev/null)
          if { [ "$armed" != "true" ] && [ "$armed" != "false" ]; } || { [ "$queued" != "true" ] && [ "$queued" != "false" ]; }; then
            echo "::error::Could not confirm PR #$PR's armed/queued state after disarm/dequeue (verification query failed or returned unparseable JSON) -- treating as unsafe (fail closed)." >&2
            exit 1
          fi
          if [ "$armed" = "true" ] || [ "$queued" = "true" ]; then
            echo "::error::PR #$PR is STILL ARMED and/or still in the merge queue (armed: $armed, queued: $queued) despite the disable-auto/dequeue calls -- this needs urgent human attention: run 'gh pr merge --disable-auto' yourself and verify, or close/reopen the PR." >&2
            exit 1
          fi
