name: Auto-Merge Trigger

# Native merge-queue cutover (this repo's instance of a pattern proven across the rest of the
# org's own fleet-wide rollout -- fleet CI redesign, wave 3+). Retires .mergify.yml. Mergify's own two
# pull_request_rules did three jobs at once -- (1) admitting a thagale/catalyst-cloud-connector[bot]
# PR once every check-success/thread-resolved condition held, (2) admitting a dependabot[bot] PR
# ONLY once dependabot-auto-merge.yml had positively labeled it `dependabot-vetted` (a minor/patch
# classification -- confirmed via `gh api repos/HagaleTechnologies/propagation/contents/.mergify.yml`;
# this repo is PUBLIC with required_approving_review_count: 0, so admission without an author/vetting
# gate would let any outside contributor's green PR merge with zero human review), and (3) actually
# performing the merge. GitHub's native `merge_queue` ruleset rule (added to propagation's existing
# "main-protection" ruleset, id 18658765, alongside this PR) replaces job (3), but has no
# author-based admission control of its own -- something still has to call `gh pr merge --auto` per
# PR, and only for a trusted author. This workflow does both (1) and (2), faithfully, below.
#
# Continuous re-check, not just enqueue-time: Mergify's own queue `merge_conditions` re-verified
# `(-author = dependabot[bot]) OR (label = dependabot-vetted)` WHILE a PR sat in queue, so a
# minor/patch bump that got reclassified to major mid-queue (dependabot-auto-merge.yml's own
# "Label major updates for review" step removes `dependabot-vetted` and adds
# `major-update,needs-review` when a later Dependabot refresh changes the classification) would stop
# matching and could no longer merge. This workflow reproduces that by re-evaluating trust fresh on
# EVERY event (including the `unlabeled: dependabot-vetted` event fired when that reclassification
# happens) rather than trusting a stale decision from an earlier event -- see is_trusted_author()
# below, called unconditionally on every non-needs-human path.
#
# propagation has no round-cap / needs-human-round-25 mechanism (no equivalent to some other
# repos' own round-25-needs-human-review) -- the needs-human handling below is NOT round-cap-specific: it's
# the general manual-pause / queue-retry-handler.yml-applied-after-one-failed-retry signal, which
# this repo needs exactly like every other migrated repo, layered independently of the
# trusted-author/dependabot-vetted gate above.
on:
  pull_request_target:
    branches: [main]
    # unlabeled/labeled: needs-human (general pause/resume, see header) AND dependabot-vetted
    # (propagation-specific trust signal -- added when dependabot-auto-merge.yml classifies a bump
    # as minor/patch, removed on reclassification to major) both need to retrigger admission
    # evaluation. Without `unlabeled` on dependabot-vetted, a mid-queue reclassification to major
    # would leave the PR silently armed/queued despite no longer being trusted -- the continuous
    # re-check above only fires on an event, and label removal IS the event. Without `labeled` on
    # dependabot-vetted, a fresh Dependabot PR (opened before vetting completes -- dependabot-auto-
    # merge.yml runs concurrently/after `opened`) would never get a second chance to arm once vetted.
    types: [opened, reopened, ready_for_review, synchronize, edited, unlabeled, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  auto-merge:
    # `edited` scoped to a real base retarget only (a proven fix from this fleet's own rollout):
    # `edited` fires on ANY PR edit -- title, body, labels, base -- but this job
    # calls `gh pr merge --auto` unconditionally for it, which could re-arm an UNCHANGED head that
    # just failed merge-group CI for reasons having nothing to do with that edit.
    if: |
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'needs-human' || github.event.label.name == 'dependabot-vetted') &&
      (github.event.action != 'labeled' || github.event.label.name == 'needs-human' || github.event.label.name == 'dependabot-vetted')
    runs-on: ubuntu-latest
    # Shared with queue-retry-handler.yml's own mutating job (another proven fix from this
    # fleet's own rollout) -- closes a real TOCTOU race where this job could read needs-human as absent and merge moments
    # after queue-retry-handler.yml handed the PR off to a human. cancel-in-progress: false: a
    # shared mutual-exclusion lock must let a queued run WAIT for the current holder to finish its
    # full read-decide-act sequence, never cancel it mid-mutation.
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # CODEX_REVIEW_PAT, not GITHUB_TOKEN: a merge attributed to GITHUB_TOKEN suppresses
      # downstream push-triggered events (GitHub's anti-recursion guard) -- any push-triggered
      # workflow needs to fire for a queue-merged commit exactly like any other push to main.
      #
      # needs-human and the trust gate are both checked here, inside the run, via a fresh API
      # fetch -- not in this job's own `if:` -- because `github.event.pull_request.labels` is a
      # webhook-delivery-time snapshot, not a live read, and the author field alone isn't enough
      # to decide dependabot trust (that also needs the CURRENT label state).
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Both tokens passed through; the script below picks per-author, not a single
          # env-level GH_TOKEN (see the selection immediately below).
          CODEX_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          # Token selection (Codex P1, found reviewing this PR): wait-for-codex.yml's own
          # header comment documents that GitHub withholds custom Actions secrets --
          # CODEX_REVIEW_PAT included -- for any workflow run triggered by a dependabot[bot]
          # actor event (this job's own `opened`/`synchronize`/etc events ARE exactly that, for
          # a Dependabot-authored PR). Using CODEX_TOKEN unconditionally would fail auth for
          # every single Dependabot PR. GITHUB_TOKEN (READ_TOKEN here) is proven to work in
          # this same trigger context already -- dependabot-auto-merge.yml's own approve/label/
          # admit steps already write successfully with it. thagale and
          # catalyst-cloud-connector[bot] PRs are unaffected by the withholding and keep using
          # CODEX_TOKEN, matching every other migrated repo's own admission pattern.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            export GH_TOKEN="$READ_TOKEN"
          else
            export GH_TOKEN="$CODEX_TOKEN"
          fi

          # labeled: a maintainer can manually attach needs-human at any time, including on a PR
          # that was already armed by an earlier opened/reopened/synchronize event. This label
          # always wins over an existing arm: disarm unconditionally and stop.
          dequeue_and_disarm() {
            gh pr merge "$PR_URL" --disable-auto >/dev/null 2>&1 || true
            OWNER_PART="${REPO%%/*}"; NAME_PART="${REPO##*/}"
            queue_state=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) { id isInMergeQueue }
                }
              }' -f owner="$OWNER_PART" -f name="$NAME_PART" -F pr="$PR" 2>/dev/null)
            pr_node_id=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.id')
            in_queue=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.isInMergeQueue')
            if [ "$in_queue" = "true" ] && [ -n "$pr_node_id" ] && [ "$pr_node_id" != "null" ]; then
              echo "::notice::PR #$PR is in the native merge queue (autoMergeRequest alone wouldn't have caught this) -- dequeuing."
              gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$pr_node_id" >/dev/null 2>&1 || true
            fi
          }
          # Fail CLOSED (report "still armed/queued", i.e. unsafe) when the verification query
          # itself can't be trusted.
          still_armed_or_queued() {
            local state armed queued
            OWNER_PART="${REPO%%/*}"; NAME_PART="${REPO##*/}"
            if ! state=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) { autoMergeRequest { enabledAt } isInMergeQueue }
                }
              }' -f owner="$OWNER_PART" -f name="$NAME_PART" -F pr="$PR" 2>/dev/null); then
              echo "::error::Could not fetch PR #$PR's live armed/queued state to verify disarm -- treating as unsafe (fail closed)." >&2
              return 0
            fi
            armed=$(printf '%s' "$state" | jq -r '.data.repository.pullRequest.autoMergeRequest != null' 2>/dev/null)
            queued=$(printf '%s' "$state" | jq -r '.data.repository.pullRequest.isInMergeQueue' 2>/dev/null)
            if { [ "$armed" != "true" ] && [ "$armed" != "false" ]; } || { [ "$queued" != "true" ] && [ "$queued" != "false" ]; }; then
              echo "::error::Could not parse PR #$PR's live armed/queued state to verify disarm -- treating as unsafe (fail closed)." >&2
              return 0
            fi
            [ "$armed" = "true" ] || [ "$queued" = "true" ]
          }

          # Trust gate (propagation-specific -- see header comment): thagale and
          # catalyst-cloud-connector[bot] are trusted unconditionally (same as Mergify's own first
          # rule -- CI/Codex-review/thread-resolution checks are the real gate for them, exactly as
          # they always were). dependabot[bot] is trusted ONLY while `dependabot-vetted` is
          # currently present -- a POSITIVE signal applied by dependabot-auto-merge.yml solely for a
          # minor/patch classification, not an absence-of-needs-review check, so a stalled/failed
          # classify run fails CLOSED (leaves the PR unqueued) rather than defaulting to trusted.
          is_trusted_author() {
            local author="$1" current_labels="$2"
            if [ "$author" = "thagale" ] || [ "$author" = "catalyst-cloud-connector[bot]" ]; then
              return 0
            fi
            if [ "$author" = "dependabot[bot]" ]; then
              grep -qxF "dependabot-vetted" <<< "$current_labels" && return 0
            fi
            return 1
          }

          if [ "$EVENT_ACTION" = "labeled" ] && [ "$EVENT_LABEL" = "needs-human" ]; then
            echo "::notice::needs-human was just attached to PR #$PR -- disarming any auto-merge that was already armed from an earlier event."
            dequeue_and_disarm
            if still_armed_or_queued; then
              echo "::error::Could not fully disarm PR #$PR after needs-human was attached -- refusing to report success. Disarm by hand (gh pr merge $PR --disable-auto --repo $REPO, and dequeue via the PR's own UI if still queued) and confirm." >&2
              exit 1
            fi
            exit 0
          fi

          # Staleness check, a proven pattern from this fleet's own needs_human_is_stale() rollout:
          # needs-human is applied by queue-retry-handler.yml below after its one automatic retry
          # also fails, with a `queue-retry-handler:needs-human sha=<sha12>` marker. Provenance is
          # checked against the label's own most recent application, not just marker content --
          # only a marker posted AT OR AFTER that event can be trusted to describe THIS
          # application. Fail closed whenever provenance can't be confirmed.
          needs_human_is_stale() {
            local current_head_sha12="$1"
            local last_labeled_at marker_info marker_created_at recorded_sha12
            local raw
            if raw=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR}/timeline" 2>/dev/null); then
              last_labeled_at=$(printf '%s' "$raw" | jq -r '(add // []) | [.[] | select(.event == "labeled" and .label.name == "needs-human")] | if length > 0 then (last | .created_at) else "" end' 2>/dev/null)
            else
              last_labeled_at=""
            fi
            [ -z "$last_labeled_at" ] && return 1
            if raw=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR}/comments" 2>/dev/null); then
              marker_info=$(printf '%s' "$raw" | jq -r '(add // []) | [.[] | select(.user.login == "github-actions[bot]") | select(.body | test("queue-retry-handler:needs-human sha=[0-9a-f]{12}")) | [.created_at, (.body | capture("queue-retry-handler:needs-human sha=(?<s>[0-9a-f]{12})").s)] | @tsv] | if length > 0 then last else "" end' 2>/dev/null)
            else
              marker_info=""
            fi
            [ -z "$marker_info" ] && return 1
            marker_created_at=$(cut -f1 <<< "$marker_info")
            recorded_sha12=$(cut -f2 <<< "$marker_info")
            [ -z "$recorded_sha12" ] && return 1
            [[ "$marker_created_at" < "$last_labeled_at" ]] && return 1
            [ "$recorded_sha12" = "$current_head_sha12" ] && return 1
            return 0
          }

          # Live base recheck, immediately before mutating (another proven fix from this fleet's
          # own rollout): this workflow's own `branches: [main]` trigger filter is evaluated once,
          # at trigger time -- it does NOT re-fire or cancel an already-running job if the PR is
          # retargeted away from main mid-run, and `gh pr merge --auto` takes no base argument at
          # all.
          #
          # Gated on the native merge_queue ruleset rule actually existing: this workflow lands in
          # the SAME PR that adds the ruleset rule (a plain `gh pr merge --squash` bootstraps into
          # the native queue even before this workflow exists on main, so no two-phase PR split is
          # needed -- proven live elsewhere in this fleet's own rollout). Before that PUT lands
          # (i.e. earlier commits on this very PR, or if the ruleset write is ever rolled back),
          # standing down here keeps Mergify the SOLE admission path -- once the rule exists,
          # Mergify's own queue check reports `action_required` and stops completing merges,
          # closing the two-queue window on its own.
          merge_if_still_targeting_main() {
            local current_base
            merge_queue_live=$(gh api "repos/${REPO}/rules/branches/main" --jq '[.[] | select(.type == "merge_queue")] | length > 0' 2>/dev/null || echo false)
            if [ "$merge_queue_live" != "true" ]; then
              echo "::notice::No merge_queue ruleset rule exists yet for main -- standing down without arming native auto-merge on PR #$PR. Mergify's own queue is still the sole merge authority until the ruleset update lands."
              return 0
            fi
            current_base=$(gh pr view "$PR" --repo "${REPO}" --json baseRefName --jq .baseRefName)
            if [ "$current_base" != "main" ]; then
              echo "::notice::PR #$PR's base is '$current_base' (not main) as of this mutation attempt -- standing down without arming auto-merge."
              return 0
            fi
            gh pr merge "$PR_URL" --auto --squash
          }

          current_labels=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
          if grep -qxF "needs-human" <<< "$current_labels"; then
            current_head_sha12=$(gh pr view "$PR" --repo "${REPO}" --json headRefOid --jq '.headRefOid[0:12]')
            if needs_human_is_stale "$current_head_sha12"; then
              echo "::notice::needs-human on PR #$PR is stale (provably tied to an earlier revision's queue-retry-handler pause, not the current head $current_head_sha12) -- clearing it and proceeding to re-evaluate trust for the new revision."
              gh api --method DELETE "repos/${REPO}/issues/${PR}/labels/needs-human" >/dev/null 2>&1 || true
              labels_after_delete=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
              if grep -qxF "needs-human" <<< "$labels_after_delete"; then
                echo "::error::Could not remove the stale needs-human label from PR #$PR -- refusing to arm auto-merge while it remains attached. Remove it by hand, then rerun this job." >&2
                exit 1
              fi
              if is_trusted_author "$PR_AUTHOR" "$labels_after_delete"; then
                merge_if_still_targeting_main
              else
                echo "::notice::PR #$PR's author ($PR_AUTHOR) is not currently trusted for auto-admission -- standing down without arming."
              fi
            else
              echo "::notice::PR #$PR has needs-human covering its current head (or its provenance could not be confirmed) -- standing down without re-arming; ensuring auto-merge is not armed/queued despite the pause."
              dequeue_and_disarm
              if still_armed_or_queued; then
                echo "::error::Could not fully disarm PR #$PR while needs-human is attached -- refusing to report success while it remains armed or queued. Disarm by hand and confirm." >&2
                exit 1
              fi
            fi
          elif is_trusted_author "$PR_AUTHOR" "$current_labels"; then
            merge_if_still_targeting_main
          else
            echo "::notice::PR #$PR's author ($PR_AUTHOR) is not currently trusted for auto-admission (not thagale/catalyst-cloud-connector[bot], or a dependabot PR without dependabot-vetted) -- standing down without arming; ensuring nothing already armed/queued from an earlier trusted state remains (covers the mid-queue reclassification-to-major case)."
            dequeue_and_disarm
            if still_armed_or_queued; then
              echo "::error::Could not fully disarm PR #$PR despite untrusted author -- refusing to report success." >&2
              exit 1
            fi
          fi
