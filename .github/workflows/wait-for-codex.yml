name: Wait for Codex

# HAG-82: replaces the old single-job polling design (a job that posted "@codex review"
# then polled for up to 75 minutes for a terminal signal) with the event-driven
# request/response pair credenza already runs for HagaleTechnologies' private repos
# (codex-review-request.yml/codex-review-response.yml). propagation is PUBLIC and
# credenza is PRIVATE -- GitHub does not allow a public repo to `uses:` a private repo's
# reusable workflow, so this file hand-ports that logic inline instead of calling it.
#
# Ported from pancetta's own HAG-80 hand-port (PR #399, feat/hag-80-event-driven-codex-gate,
# 19 review rounds -- every mechanism below is that PR's final, hardened design, not
# re-derived from scratch). Full discovery history (the job-name/managed-check-name
# collision saga, the Dependabot-secrets saga, the marker-forgery hardening, the
# freshness-recheck race fix) lives in catalyst memory
# project_hag80_pancetta_migration_20260924 -- read that before touching this file's
# check-run/label mechanics, rather than rediscovering the same bugs a third time.
#
# propagation's OWN prior wait-for-codex.yml (single-job, poll-based) had independently
# accumulated most of the same hard-won detection logic through its own long history
# across this fleet (comment_head_tied/error_head_tied/reviewed_commit_prefix parsing,
# the IS_SYNC/loose-vs-strict branch, the combined-GraphQL-query rate-limit fix) --
# credited inline below wherever a specific mechanism's origin is that file, not
# pancetta's. Where the two designs diverged, pancetta's newer, more-reviewed version
# was kept (e.g. requiring a HEAD_SHA-tied signal unconditionally, rather than a looser
# untied-comment/reaction fallback for the very first review) since it is the more
# conservative, more recently hardened of the two.
#
# propagation's ci.yml already gates `test` behind a GitHub LABEL
# (`codex-clean:<sha12>`, polled by ci.yml's own `codex-clean` job) -- exactly pancetta's
# design, not coppa's separate Checks-API-dispatch file. That interface is untouched
# here -- this file keeps applying the exact same label ci.yml already expects, via the
# same apply_clean_label() function the old design used. ci.yml needs no changes beyond
# the same poll-timeout margin fix pancetta's own ci.yml needed (see that file's own
# header comment) -- applied here proactively rather than waiting to rediscover it.
#
# Top-level workflow `name:` is deliberately UNCHANGED ("Wait for Codex", not renamed) --
# any external tooling matching on this exact field (mirroring pancetta's own
# queue-retry-handler.yml precedent) would otherwise silently break.
#
# The job's own name -- and therefore the check-run/required-status-check name -- IS
# renamed, from "Wait for Codex Review" to "Codex review clean (gate before expensive
# downstream jobs)", matching every other repo in this HAG-75 rollout (the exact string
# credenza's org-wide codex-review-timeout-scan.yml backstop greps for, byte-identical
# across the whole fleet). Retargeting propagation's ruleset (18658765,
# required_status_checks currently ["Wiki lint","test","Wait for Codex Review"]) to the
# new name is a merge-time action, not something this file can do.
#
# Known accepted gap (HAG-87): if Codex's ONLY terminal signal for a round is a bare
# thumbs-up reaction with no formal review/comment, no event below fires
# codex-review-response -- GitHub Actions has no native trigger for "reaction added."
# credenza's own shared pair has this identical gap; every credenza-`uses:`-based
# migration in this fleet relies on the same org-wide backstop for it:
# credenza's codex-review-timeout-scan.yml (15min cron) re-requests a review at 90min and
# fails the check at 120min if still stuck, regardless of which repo or mechanism produced
# the check-run. Not fixed locally here for the same reason it isn't on any sibling repo.
#
# Before assuming propagation shares pancetta's own HAG-96 gap (issue_comment never
# triggers a workflow run there, root cause not yet identified): check this repo's own
# history first (`gh api --paginate repos/HagaleTechnologies/propagation/actions/runs
# --jq '.workflow_runs[] | .event' | sort | uniq -c`) -- do not assume it applies here
# without verifying.

on:
  # pull_request_target (not pull_request): a same-repo PR that edits THIS file could,
  # under pull_request, run its OWN modified copy with CODEX_REVIEW_PAT still in scope --
  # able to exfiltrate the PAT or self-resolve its own Codex review threads before a human
  # ever looks. pull_request_target always reads its workflow definition from the BASE
  # branch, so a PR modifying this file has zero effect on what runs for it until the
  # change is actually merged. Safe here because the request job never checks out or
  # executes the PR's own code -- only `gh api` calls against metadata (PR number, head
  # SHA) from the event payload. Carried forward from propagation's own prior file, which
  # already made this same choice for the same reason.
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened]
  # codex-review-response's own job-level `if:` already gates on pull_request_review/
  # issue_comment/pull_request_review_comment from the Codex bot actor -- but without
  # these event types actually triggering the WORKFLOW at all, that job could never run
  # in the first place. Every real Codex response would leave the managed check
  # permanently in_progress until the org-wide timeout-scan backstop eventually failed it.
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  # Codex P2, this PR's own round 1: when Codex's response is a REPLY to an existing
  # review thread (restating a still-live concern, rather than a new formal review or a
  # bare issue comment), GitHub fires pull_request_review_comment, not
  # pull_request_review or issue_comment -- this workflow never started the response job
  # for exactly the case compute-verdict's own restated_count logic exists to catch,
  # leaving the managed check in_progress until the org-wide timeout backstop eventually
  # intervened. Likely a shared gap on coppa/pancetta too (their own `on:` blocks have the
  # identical omission) -- worth checking there once confirmed fixed here.
  pull_request_review_comment:
    types: [created]
  # merge_group: propagation's native merge-queue ruleset re-evaluates every required
  # check against a temporary merge-group SHA with no associated PR context. Handled by
  # an event-gated pass-through step in the request job rather than a second job (two
  # same-named check-runs would rely on undocumented same-name multi-run matching
  # semantics for a REQUIRED check -- propagation's own OLD file already made this exact
  # design choice, carried forward unchanged).
  #
  # IMPORTANT bootstrap note (learned live on coppa PR #113, reconfirmed on pancetta PR
  # #399): merge_group evaluates the workflow file as it exists in the PR's OWN INCOMING
  # content, not the base branch's copy -- the OPPOSITE of pull_request_target. This
  # means THIS PR's own merge-group evaluation will produce "Codex review clean (gate
  # before expensive downstream jobs)", NOT "Wait for Codex Review" -- the OLD required
  # check name can never appear on this PR's own merge-group commit no matter how long
  # you wait, regardless of the OLD file already having a working merge_group trigger (it
  # does). This is expected, not a bug: the fix is to temporarily drop "Wait for Codex
  # Review" from ruleset 18658765's required list before merging THIS SPECIFIC PR, then
  # restore/retarget it -- a one-time bootstrap cost, not something fixable in this file.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  # ============================================================================================
  # Producer half: fires on every pull_request_target action (plus merge_group). Creates/
  # upserts the "Codex review clean (gate before expensive downstream jobs)" check-run and
  # asks Codex to look -- never waits for a response itself. Either an immediate
  # pass-through (applies the codex-clean label directly, no Codex round to wait on) or
  # leaves the check-run in_progress for codex-review-response below to complete once Codex
  # actually replies.
  # ============================================================================================
  codex-review-request:
    # This job's display name must NEVER equal the Checks-API-managed check's name -- two
    # previously-tried patches on pancetta's own HAG-80 both failed this way (naming it
    # identically and relying on native per-job attribution for merge_group/Dependabot
    # pass-through let this job's own quick completion ALSO publish a native SUCCESS
    # under the managed name for a REAL round; renaming without an explicit upsert for
    # every path broke the pass-through paths outright). The fix ported here: keep this
    # job's name DISTINCT, and publish the managed check EXPLICITLY via upsert_check_run
    # on every path this job handles -- merge_group calls it directly, rather than
    # depending on native job-skip/job-success attribution.
    #
    # Dependabot is excluded at the JOB level (not routed through the explicit-upsert
    # path) -- GitHub withholds Actions secrets for Dependabot-triggered
    # pull_request_target events, so the App-token mint step below would fail before ever
    # reaching a Dependabot success branch (pancetta's own round-8/14/15 saga; propagation's
    # own OLD file already excluded Dependabot at this same job level for this same
    # documented reason, so this is a straight continuation, not a new decision). merge_group
    # is unaffected: merge_group events are not Dependabot-triggered and have normal secret
    # access.
    name: Codex review request (producer)
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    # A newer push must supersede an older run outright -- cancelling is simpler and
    # stronger than re-verifying HEAD right before the mutation. merge_group.head_sha keeps
    # concurrent merge-queue entries in DISTINCT groups; run_attempt == 1 only, so a stale
    # rerun replaying an old event can't cancel a run actively gating a newer head before
    # that run's own head-check step gets a chance to no-op the stale one instead.
    concurrency:
      group: codex-review-request-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
      cancel-in-progress: ${{ github.run_attempt == 1 }}
    outputs:
      check_run_id: ${{ steps.create-check.outputs.check_run_id }}
    steps:
      - name: Mint a hagale-agent installation token for check-run writes
        id: app-token
        # Checks API create/update endpoints only accept a GitHub App token --
        # github.token can create a check-run within its own run but is rejected for
        # updating one a DIFFERENT run created, and a plain PAT is rejected outright for
        # both create and update. hagale-agent (App ID 4696353) is not subject to either
        # restriction. Already used fleet-wide (HAG-44/74/75/78/80). Also minted for
        # merge_group -- that path explicitly upserts the managed check too, rather than
        # relying on this job's own native attribution (see the job's header comment).
        if: github.event_name == 'merge_group' || github.event_name == 'pull_request_target'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 4696353
          private-key: ${{ secrets.HAGALE_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Skip if this run's head no longer matches the PR's current head
        id: head-check
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A manual rerun of an old attempt replays the ORIGINAL event payload,
          # including its now-stale head SHA -- compare against the PR's LIVE head at run
          # time and no-op if this run is for a superseded commit.
          #
          # Bounded retry, not a bare assignment: a transient REST/auth/rate-limit failure
          # here would otherwise abort this whole step under this step's default `bash -e`
          # before the request is even posted. 3 attempts over ~15s absorbs a genuine
          # blip; if still failing after that, proceed as if not stale rather than crash.
          CURRENT_HEAD_SHA=""
          for _ in 1 2 3; do
            CURRENT_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha' 2>/tmp/head-lookup-err.log) && break
            echo "::warning::Transient error looking up the PR's current head -- retrying in 5s: $(cat /tmp/head-lookup-err.log)"
            sleep 5
          done
          if [ -z "$CURRENT_HEAD_SHA" ]; then
            echo "::warning::Could not confirm the PR's current head after 3 attempts -- proceeding as if this run's head is current."
            CURRENT_HEAD_SHA="$EVENT_HEAD_SHA"
          fi
          if [ "$EVENT_HEAD_SHA" != "$CURRENT_HEAD_SHA" ]; then
            echo "::notice::This run's head ($EVENT_HEAD_SHA) no longer matches the PR's current head ($CURRENT_HEAD_SHA) -- skipping as superseded."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Bootstrap check: does the base branch have this repo's own event-driven gate yet?"
        id: bootstrap-check
        if: github.event_name == 'pull_request_target' && steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # pull_request_target ALWAYS executes the BASE branch's copy, never the PR's
          # own -- so the PR that first wires this mechanism up can never see it live for
          # its own pushes until it merges. Pinned to base.sha, not base.ref. Grep for
          # `upsert_check_run`, a function name unique to this new architecture -- plain
          # file existence isn't enough, since propagation's OLD wait-for-codex.yml also
          # existed at every reachable base SHA before this migration.
          err_file="$(mktemp)"
          if content="$(gh api "repos/$REPO/contents/.github/workflows/wait-for-codex.yml?ref=$BASE_SHA" -H "Accept: application/vnd.github.raw" 2>"$err_file")"; then
            if echo "$content" | grep -q "upsert_check_run"; then
              echo "bootstrap_status=ready" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Base branch's wait-for-codex.yml at $BASE_SHA exists but predates this migration -- passing through unconditionally."
              echo "bootstrap_status=absent" >> "$GITHUB_OUTPUT"
            fi
          else
            err="$(cat "$err_file")"
            if echo "$err" | grep -qiE "HTTP 404|not found"; then
              echo "::warning::Base branch has no wait-for-codex.yml at $BASE_SHA (clean 404) -- this is the bootstrap PR itself. Passing through unconditionally."
              echo "bootstrap_status=absent" >> "$GITHUB_OUTPUT"
            else
              echo "bootstrap_status=fetch-failed" >> "$GITHUB_OUTPUT"
              echo "::error::Could not determine whether base branch has this migration yet (non-404 failure fetching $BASE_SHA, failing closed): $err"
              exit 1
            fi
          fi

      - name: "Self-heal: does the codex-clean label already exist for this exact head?"
        id: existing-label
        if: github.event_name == 'pull_request_target' && steps.head-check.outputs.stale != 'true' && steps.bootstrap-check.outputs.bootstrap_status == 'ready'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="codex-clean:${HEAD_SHA:0:12}"
          if labels=$(gh api "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name]' 2>/dev/null); then
            if echo "$labels" | jq -e --arg l "$target" 'index($l) != null' >/dev/null 2>&1; then
              echo "already_clean=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "already_clean=false" >> "$GITHUB_OUTPUT"

      - name: Create/upsert the codex-clean check-run
        id: create-check
        # Also runs for merge_group, explicitly upserting the managed check to
        # completed/success there (see the job's own header comment) instead of relying
        # on a standalone pass-through step's mere existence.
        if: github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && steps.head-check.outputs.stale != 'true')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          RUN_ID: ${{ github.run_id }}
          ALREADY_CLEAN: ${{ steps.existing-label.outputs.already_clean || 'false' }}
          BOOTSTRAP_STATUS: ${{ steps.bootstrap-check.outputs.bootstrap_status || 'absent' }}
          IS_MERGE_GROUP: ${{ github.event_name == 'merge_group' }}
        run: |
          set -o pipefail

          # Durable fix for the duplicate-check-run bug (credenza org-wide fix,
          # 2026-09-19): upserting -- look up any existing check-run for this exact
          # (head_sha, name), PATCH it in place, and only POST when none exists yet --
          # guarantees at most one check-run per (head_sha, name) ever exists.
          # `--paginate`: a PR with enough review rounds can push this commit's
          # check-run count past the REST default page size. `--paginate` alone runs a
          # `--jq` filter once PER PAGE -- `gh api`'s own `--slurp` is REJECTED outright
          # when combined with `--jq`. Piping the raw `--paginate` output into a SEPARATE
          # `jq -s` is the only way to combine pages before filtering.
          #
          # upsert_check_run sets globals rather than only echoing an id -- it must be
          # called as a plain statement, NEVER via $(...), since command substitution
          # forks a subshell and any variable assignment inside would be invisible to the
          # caller once it returns. UPSERT_PRE_STATUS is the check-run's status as it
          # stood BEFORE this call touched it -- empty when none existed yet, otherwise
          # "completed" or "in_progress". Read by "Request a review" below.
          UPSERT_ID=""
          UPSERT_PRE_STATUS=""
          UPSERT_PRE_TITLE=""
          # Filtered to external_id looking like a numeric run-id -- excludes GitHub's
          # own native per-job check-run attribution (a "skipped" check-run for any job
          # whose `if:` evaluates false, published under that job's CURRENT name, with a
          # GitHub-generated UUID external_id), which would otherwise be selected as "the"
          # existing check-run to PATCH whenever it happens to be the most recent entry
          # sharing this exact name.
          upsert_check_run() {
            local name="$1" status="$2" conclusion="$3" existing_id existing_status existing_title lookup
            lookup=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              | jq -s "[.[].check_runs[] | select(.name == \"$name\") | select((.external_id // \"\") | test(\"^[0-9]+\$\"))] | sort_by(.started_at) | last")
            existing_id=$(echo "$lookup" | jq -r '.id // empty')
            existing_status=$(echo "$lookup" | jq -r '.status // empty')
            existing_title=$(echo "$lookup" | jq -r '.output.title // empty')
            UPSERT_PRE_STATUS="$existing_status"
            UPSERT_PRE_TITLE="$existing_title"
            if [ -n "$existing_id" ]; then
              if [ -n "$conclusion" ]; then
                UPSERT_ID=$(gh api -X PATCH "repos/$REPO/check-runs/$existing_id" \
                  -f status="$status" -f conclusion="$conclusion" -f external_id="$RUN_ID" --jq '.id')
              else
                UPSERT_ID=$(gh api -X PATCH "repos/$REPO/check-runs/$existing_id" \
                  -f status="$status" -f external_id="$RUN_ID" --jq '.id')
              fi
            else
              if [ -n "$conclusion" ]; then
                UPSERT_ID=$(gh api -X POST "repos/$REPO/check-runs" \
                  -f name="$name" -f head_sha="$HEAD_SHA" -f status="$status" -f conclusion="$conclusion" -f external_id="$RUN_ID" \
                  --jq '.id')
              else
                UPSERT_ID=$(gh api -X POST "repos/$REPO/check-runs" \
                  -f name="$name" -f head_sha="$HEAD_SHA" -f status="$status" -f external_id="$RUN_ID" \
                  --jq '.id')
              fi
            fi
          }

          # merge_group (the constituent PR already passed a real Codex review during its
          # own PR phase -- nothing further to review on this synthetic integration
          # commit), OR bootstrap not live yet, OR the label already exists: pass through
          # immediately with a completed, successful check-run. Dependabot never reaches
          # this step at all -- excluded at the job level (see the job's own header
          # comment), since GitHub withholds secrets from Dependabot-triggered runs and this
          # step needs the minted App token.
          if [ "$IS_MERGE_GROUP" = "true" ]; then
            conclusion="success"
          elif [ "$BOOTSTRAP_STATUS" != "ready" ]; then
            conclusion="success"
          elif [ "$ALREADY_CLEAN" = "true" ]; then
            conclusion="success"
          else
            conclusion=""
          fi

          if [ -n "$conclusion" ]; then
            upsert_check_run "Codex review clean (gate before expensive downstream jobs)" "completed" "$conclusion"
            check_id="$UPSERT_ID"
            echo "Upserted completed check-run ($conclusion) for $HEAD_SHA -- no wait needed."
          else
            upsert_check_run "Codex review clean (gate before expensive downstream jobs)" "in_progress" ""
            check_id="$UPSERT_ID"
            # No local timeout of its own for the case where the request comment fails to
            # post, Codex is unavailable, or no supported response event ever fires --
            # credenza's org-wide codex-review-timeout-scan.yml (~/Code/credenza/.github/
            # workflows/codex-review-timeout-scan.yml, 15min cron) re-requests a review at
            # 90min and fails the check outright at 120min if still stuck, regardless of
            # which repo or mechanism created it -- the same backstop every credenza-
            # `uses:`-based migration in this fleet also relies on, PROVIDED the check
            # name above stays byte-identical to what the scanner greps for.
            echo "Upserted in_progress check-run for $HEAD_SHA -- codex-review-response will complete it once Codex responds, or credenza's org-wide timeout-scan backstop will within 120 minutes."
          fi
          {
            echo "check_run_id=$check_id"
            echo "conclusion=$conclusion"
            echo "pre_existing_status=$UPSERT_PRE_STATUS"
            echo "pre_existing_title=$UPSERT_PRE_TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Request a review
        if: steps.create-check.outputs.check_run_id != '' && steps.create-check.outputs.conclusion != 'success' && steps.bootstrap-check.outputs.bootstrap_status == 'ready' && steps.existing-label.outputs.already_clean != 'true'
        env:
          # CODEX_REVIEW_PAT is an org secret (visibility: all), already available to
          # propagation -- no new secret needed. Codex's own native auto-trigger-on-open
          # was disabled org-wide (2026-09-08); an explicit "@codex review" comment is the
          # only path to a real review. propagation's own OLD file already relied on this
          # exact secret for this exact purpose.
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CODEX_REVIEW_PAT not available -- skipping the request comment. A formal Codex review tied to this head still resolves the check normally via codex-review-response, once one lands."
            exit 0
          fi
          gh api "repos/$REPO/issues/$PR/comments" -f body="@codex review" >/dev/null
          # Request and response are DIFFERENT workflow runs (decoupled, event-driven), so
          # github.run_attempt in the response job is ALWAYS 1 for a genuinely-fired
          # response event -- it can never distinguish a real new commit from a bare
          # re-request of an UNCHANGED head_sha. That distinction has to be recorded
          # somewhere durable the response job can independently read back: a marker
          # comment counting how many times THIS EXACT head_sha has been requested. Posted
          # as its OWN comment, not appended to the "@codex review" trigger text above, to
          # avoid any risk of interfering with Codex's own trigger-phrase matching.
          #
          # Only post the marker when the check-run for this head_sha was NOT already
          # "completed" before create-check's upsert just above -- i.e. this is either a
          # brand-new head_sha, or one still genuinely in_progress from an earlier
          # unanswered request. A PATCH from "completed" back to "in_progress" (this exact
          # head_sha already reached a terminal state once before -- via a real Codex
          # round, a pass-through success, or ANY other cause) means the code has not
          # changed since that prior completion, so this round must NOT read as genuine no
          # matter how it's triggered (opened, ready_for_review, reopened). This closes a
          # gap found live on coppa PR #113 round 6: a draft PR reviewed out-of-band (a
          # manual "@codex review" bypassing the automated pass-through, which posts no
          # marker) then marked ready_for_review with the same unchanged head_sha would
          # otherwise wrongly baseline-and-ignore any unresolved findings from that
          # draft-era review.
          #
          # codex-review-request-failsafe's own placeholder ("Codex review request setup
          # failed", posted when this job fails before create-check ever runs) also
          # leaves this head_sha's check-run "completed" -- but that's not a genuine prior
          # review outcome, just a stand-in saying setup itself never happened. Excluded
          # by its own distinctive title (pancetta HAG-80 round 16 fix, must stay
          # byte-identical to the failsafe's `output.title` below).
          PRE_EXISTING_STATUS="${{ steps.create-check.outputs.pre_existing_status }}"
          PRE_EXISTING_TITLE="${{ steps.create-check.outputs.pre_existing_title }}"
          if [ "$PRE_EXISTING_STATUS" = "completed" ] && [ "$PRE_EXISTING_TITLE" != "Codex review request setup failed" ]; then
            echo "This head_sha's check-run was already completed before this request -- not marking this round genuine (no new commit landed)."
          else
            # Codex P1, this PR's own round 2: a bare, unguarded POST here meant a
            # transient failure AFTER the "@codex review" comment above already succeeded
            # left the check-run in_progress with no marker -- codex-review-response would
            # then read IS_MARKED=false and treat a genuine remediation round as a bare
            # rerun, failing it on any unresolved baseline concern. Worse, once that
            # response concludes the check to "completed" (a real conclusion, not the
            # failsafe's own placeholder this same condition already excludes above), a
            # later rerun of THIS job can never re-post the marker either -- the head_sha
            # now reads as already-completed, permanently trapping the PR until an actual
            # new commit lands. Retried like every other write in this file (3 attempts,
            # 5s backoff) to close the transient case; a loud, non-fatal warning on
            # exhaustion, matching apply_clean_label/remove_clean_label's own established
            # fail-loud-but-continue precedent -- failing this step outright would not
            # actually help recovery here, since the failsafe below deliberately no-ops
            # once a check-run already exists for this head_sha.
            marker_posted="false"
            for _ in 1 2 3; do
              if gh api "repos/$REPO/issues/$PR/comments" -f body="<!-- codex-review-request head_sha=$HEAD_SHA -->" >/dev/null 2>/tmp/marker-post-err.log; then
                marker_posted="true"
                break
              fi
              sleep 5
            done
            if [ "$marker_posted" != "true" ]; then
              echo "::error::Could not post the genuine-sync marker for $HEAD_SHA after 3 attempts: $(cat /tmp/marker-post-err.log 2>/dev/null) -- this round may be misclassified as a bare rerun if Codex responds before a retry succeeds." >&2
            fi
          fi

  # ============================================================================================
  # Failsafe: codex-review-request's own steps run BEFORE create-check can ever run (app-token
  # mint, head-check, bootstrap-check, existing-label) -- if any of those fails, the job stops
  # and no check-run is ever created for this head_sha at all. credenza's org-wide timeout-scan
  # backstop only scans check-runs that ALREADY exist and are stuck in_progress -- it has
  # nothing to find here, since none was ever posted, and a pull_request_target run provides no
  # native required check either. A transient setup failure (an expired/misconfigured App key,
  # a GitHub API blip) would otherwise leave the required gate permanently absent rather than
  # failing, silently blocking the PR forever.
  # ============================================================================================
  codex-review-request-failsafe:
    name: Codex review request setup failsafe
    needs: codex-review-request
    # Also covers merge_group: that event depends on the SAME app-token mint + create-check
    # machinery as pull_request_target to publish the required check, so a transient
    # App/API failure on a merge_group run needs the identical recovery path.
    if: always() && needs.codex-review-request.result == 'failure' && (github.event_name == 'pull_request_target' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      checks: write
    steps:
      # Creating this check-run with github.token means only a GitHub-Actions-identity
      # token can ever update it again -- codex-review-request's OWN upsert_check_run
      # always authenticates as hagale-agent, so a rerun's attempt to PATCH this exact
      # check-run 403s outright (Checks API only permits the CREATING app to update a
      # check-run). Minted INDEPENDENTLY here (this job's own step, not a dependency on
      # codex-review-request's own mint, which may itself be what failed) -- most
      # transient failures leave the App itself healthy, so this mint typically succeeds
      # even when the original one didn't. continue-on-error keeps github.token as a
      # last-resort fallback for the genuine case where the App itself is unavailable --
      # at that point only a brand-new commit can unblock the PR anyway (a residual gap:
      # if BOTH mints fail, the resulting github.token-owned check can never be PATCHed
      # by hagale-agent even after the App recovers -- see catalyst memory
      # project_hag78_coppa_migration_20260922, HAG-90, for the same gap on coppa).
      - name: Mint a hagale-agent installation token for check-run writes
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 4696353
          private-key: ${{ secrets.HAGALE_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Publish a failed check-run since request setup itself failed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          USED_GITHUB_TOKEN: ${{ steps.app-token.outcome == 'failure' && 'true' || 'false' }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Only proceed when no check-run for this head_sha exists yet at all -- if a
          # LATER step in codex-review-request's job fails (the marker-comment POST) after
          # create-check already ran and succeeded, posting unconditionally here would
          # stack a second, duplicate "completed/failure" check-run next to the real one.
          # Same numeric-external_id filter as elsewhere in this file: a GitHub-native
          # "skipped" check-run from an EARLIER pull_request_review/issue_comment-triggered
          # run of codex-review-request (job-level-skipped, sharing this exact name, UUID
          # external_id) must not count as "the real check already exists" here.
          existing=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            | jq -s '[.[].check_runs[] | select(.name == "Codex review clean (gate before expensive downstream jobs)") | select((.external_id // "") | test("^[0-9]+$"))] | length')
          if [ "$existing" -gt 0 ]; then
            echo "A check-run already exists for $HEAD_SHA -- create-check ran successfully before a later step failed. Nothing to do here."
            exit 0
          fi
          if [ "$USED_GITHUB_TOKEN" = "true" ]; then
            summary="The codex-review-request job failed before it could create the managed check-run (run $RUN_ID), and hagale-agent could not be minted here either. Only a NEW COMMIT can unblock this PR -- a rerun will create this check-run with github.token again, which a future hagale-agent-authenticated run can never update."
          else
            summary="The codex-review-request job failed before it could create the managed check-run (run $RUN_ID). Push a new commit, or re-run the failed job and let it retry, to unblock this PR."
          fi
          # Without a numeric external_id, this check-run can never be found by the
          # numeric-external_id lookup filter on a future rerun -- a failed rerun would
          # stack ANOTHER failure instead of recognizing this one already exists, and a
          # successful rerun would create a separate managed check rather than patching
          # this one, breaking the recovery path the summary promises.
          cat <<JSON | gh api "repos/$REPO/check-runs" --input -
          {
            "name": "Codex review clean (gate before expensive downstream jobs)",
            "head_sha": "$HEAD_SHA",
            "status": "completed",
            "conclusion": "failure",
            "external_id": "$RUN_ID",
            "details_url": "https://github.com/$REPO/actions/runs/$RUN_ID",
            "output": {
              "title": "Codex review request setup failed",
              "summary": "$summary"
            }
          }
          JSON

  # ============================================================================================
  # Consumer half: fires once per Codex reply (pull_request_review or issue_comment from
  # Codex's own actor), never on a poll interval. Re-derives everything it needs from live
  # GitHub data using timestamp comparison against the request comment's own creation time --
  # no cross-invocation state beyond the marker comments and the check-run's own status.
  #
  # This job's own signal-detection logic (comment_head_tied / error_head_tied /
  # reviewed_commit_prefix parsing) originates from propagation's OWN prior wait-for-codex.yml,
  # itself accumulated across this fleet's history (skimmer, harbor, widdershins, coppa,
  # manta, pancetta -- see the specific PR references inline below). pancetta's HAG-80 kept
  # this exact detection logic, translated from a polling loop into a single per-event
  # evaluation, and added the marker/TRUSTED_LOGIN mechanism this port also carries forward.
  # ============================================================================================
  codex-review-response:
    name: Codex review response
    # Compared against the RAW WEBHOOK/Actions-context login field, NOT GraphQL's
    # author.login -- these two APIs disagree on bot-actor login formatting (the webhook
    # payload reports the [bot]-suffixed form).
    if: |
      (github.event_name == 'pull_request_review' && (github.event.review.user.login == 'chatgpt-codex-connector' || github.event.review.user.login == 'chatgpt-codex-connector[bot]')) ||
      (github.event_name == 'issue_comment' && (github.event.comment.user.login == 'chatgpt-codex-connector' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') && github.event.issue.pull_request != null) ||
      (github.event_name == 'pull_request_review_comment' && (github.event.comment.user.login == 'chatgpt-codex-connector' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    # Keyed on the PR/issue number, not the SHA, since multiple response events for the
    # same PR can land close together and must serialize, not race each other's
    # thread-resolution mutations. cancel-in-progress: false is deliberate -- an in-flight
    # thread-resolution loop must finish cleanly, not be killed mid-mutation by its own
    # next event (see "Re-check the live head" below for how the resulting race is
    # actually closed).
    concurrency:
      group: codex-review-response-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Mint a hagale-agent installation token for check-run writes
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 4696353
          private-key: ${{ secrets.HAGALE_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Resolve PR context
        id: pr-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review" ] || [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            PR="${{ github.event.pull_request.number }}"
          else
            PR="${{ github.event.issue.number }}"
          fi
          HEAD_SHA=""
          for _ in 1 2 3; do
            HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha' 2>/tmp/pr-context-err.log) && break
            echo "::warning::Transient error resolving PR context -- retrying in 5s: $(cat /tmp/pr-context-err.log)"
            sleep 5
          done
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Could not resolve PR #$PR's head SHA after 3 attempts: $(cat /tmp/pr-context-err.log)"
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Skip if this event targeted a superseded head
        id: head-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # pull_request_review carries its own commit_id, tied to WHEN that formal review
          # was submitted, so it's a direct staleness signal. issue_comment carries no
          # commit_id at all (checked via comment_head_tied/error_head_tied in the verdict
          # step below instead). pull_request_review_comment's own commit_id is anchored to
          # the ORIGINAL commit the review thread was opened against, not necessarily the
          # PR's current head, even for a brand-new reply -- checking it the same way as a
          # formal review's commit_id would wrongly mark a genuinely-current reply as stale
          # whenever its thread predates the latest push. Left unchecked here for that
          # event type; the freshness-check step and compute-verdict's own live re-read of
          # thread state (unaffected by anchor commit) are the correct gates for it.
          if [ "${{ github.event_name }}" = "pull_request_review" ] && \
             [ "${{ github.event.review.commit_id }}" != "${{ steps.pr-context.outputs.head_sha }}" ]; then
            echo "::notice::This review targeted ${{ github.event.review.commit_id }}, which is no longer the PR's current head (${{ steps.pr-context.outputs.head_sha }}) -- skipping as superseded."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the most recent request comment for this head
        id: request-comment
        if: steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_REVIEW_PAT: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
        run: |
          # The marker comment is plain text anyone with comment access could type or
          # paste verbatim -- without an author check, a PR author could forge
          # `<!-- codex-review-request head_sha=X -->` on an unchanged head_sha to make it
          # read as genuinely re-synced, letting unresolved baseline findings through the
          # success path with no remediation commit. Only the identity behind
          # CODEX_REVIEW_PAT can legitimately post this marker (the request job's own
          # "Request a review" step), so resolve that identity's login dynamically here
          # (never hardcode a specific account -- this same file is reused across
          # HagaleTechnologies repos, and CODEX_REVIEW_PAT is a personal account's PAT, not
          # a dedicated bot identity, so it can differ by repo/org) and require it on both
          # the marker query below and marker_count's own query in compute-verdict.
          TRUSTED_LOGIN=""
          if [ -n "$CODEX_REVIEW_PAT" ]; then
            TRUSTED_LOGIN=$(GH_TOKEN="$CODEX_REVIEW_PAT" gh api user --jq '.login' 2>/dev/null || echo "")
          fi
          echo "trusted_login=$TRUSTED_LOGIN" >> "$GITHUB_OUTPUT"
          # --paginate, piped into a separate `jq -s`: a heavily-discussed PR can push
          # comment count past 100, silently missing the truly most-recent "@codex review"
          # comment.
          #
          # Filtered to TRUSTED_LOGIN here too (not just the marker below): a commenter who
          # posts their own "@codex review" in the brief window between the automated
          # request job's own "@codex review" and marker posts could otherwise have theirs
          # selected as "last" (still chronologically before the genuine marker), shifting
          # run_started to their forged timestamp while is_marked still matched the real
          # marker landing within the pairing window after it (see that window's own
          # comment below for why it's 60s, not 10s).
          all_comments=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" | jq -s '[.[][]]')
          comment=$(echo "$all_comments" | jq --arg login "$TRUSTED_LOGIN" '[.[] | select(.body == "@codex review") | select($login != "" and .user.login == $login)] | sort_by(.created_at) | last')
          # A maintainer can manually type "@codex review" as a bare comment, bypassing
          # this workflow's own request job entirely -- that comment has no accompanying
          # marker (only the automated request job posts one), so counting markers alone
          # would still (wrongly) classify it as the sole/genuine request. Pair the
          # SELECTED comment with a marker landing within the window after it (posted
          # back-to-back by the same automated step) -- an unmarked selected comment is
          # conservatively NOT genuine, matching a bare manual re-request of unchanged code.
          #
          # Codex P1, this PR's own round 3: this window was 10s, sized for a single
          # unconditional POST -- but the marker POST now retries up to 3 times with a 5s
          # sleep after each failed attempt (see "Request a review" above), so a marker
          # that only succeeds on its second or third attempt can land 10-20+ seconds
          # after the request comment, well past the old window, misclassifying a genuine
          # recovery as unmarked. Widened to 60s: comfortably covers the retry's own worst
          # case (up to ~10s of sleeping plus each attempt's own API latency) with margin,
          # rather than a razor-thin bound tied to one specific retry count/backoff.
          if [ "$comment" != "null" ] && [ -n "$comment" ]; then
            comment_epoch=$(date -u -d "$(echo "$comment" | jq -r '.created_at')" +%s)
            is_marked=$(echo "$all_comments" | jq --arg sha "$HEAD_SHA" --arg login "$TRUSTED_LOGIN" --argjson after "$comment_epoch" '
              [.[] | select(.body == "<!-- codex-review-request head_sha=\($sha) -->")
                   | select($login != "" and .user.login == $login)
                   | select((.created_at | fromdateiso8601) >= $after and (.created_at | fromdateiso8601) <= ($after + 60))
              ] | length > 0')
            echo "is_marked=$is_marked" >> "$GITHUB_OUTPUT"
          fi
          if [ "$comment" = "null" ] || [ -z "$comment" ]; then
            echo "::warning::No '@codex review' request comment found on PR #$PR -- falling back to 30 minutes ago as RUN_STARTED."
            echo "run_started=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            echo "comment_node_id=" >> "$GITHUB_OUTPUT"
          else
            echo "run_started=$(echo "$comment" | jq -r '.created_at')" >> "$GITHUB_OUTPUT"
            echo "comment_node_id=$(echo "$comment" | jq -r '.node_id')" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute baseline threads as of the request comment
        id: baseline
        if: steps.head-check.outputs.stale != 'true'
        # This reads LIVE isResolved state at RESPONSE time, not as it stood when the
        # request was posted -- a thread resolved at request time but reopened by a human
        # before Codex actually replies gets folded into baseline as "already known,"
        # rather than recognized as a genuinely NEW event. Narrow window, doesn't affect
        # the core new_count/restated_count gate, only the auto-resolve convenience path
        # (accepted, deferred on pancetta as HAG-89; carried forward unfixed here for the
        # same reason).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          SINCE: ${{ steps.request-comment.outputs.run_started }}
        run: |
          owner="${REPO%%/*}"; name="${REPO##*/}"
          # A single unpaginated reviewThreads(first: 100) page silently drops any thread
          # beyond the 100th on a heavily-discussed PR -- a dropped thread can never enter
          # baseline_pure/baseline_initiated, so it's neither correctly ignored nor
          # correctly treated as new. `-F after="$cursor"`, not `-f`: only `-F`'s
          # typed-value conversion turns the literal string "null" into a real JSON null
          # for the first page -- GraphQL's $after: String rejects the literal text "null"
          # as an invalid cursor. Each thread's OWN comments(first: 50) is still
          # unpaginated (accepted, deferred on pancetta as HAG-91; matches propagation's
          # own prior file's already-accepted limitation too).
          all_nodes="[]"
          cursor="null"
          while true; do
            page=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!, $after: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        isResolved
                        comments(first: 50) { nodes { author { login } createdAt } }
                      }
                    }
                  }
                }
              }' -f owner="$owner" -f name="$name" -F pr="$PR" -F after="$cursor")
            all_nodes=$(jq -n --argjson acc "$all_nodes" --argjson new "$(echo "$page" | jq '.data.repository.pullRequest.reviewThreads.nodes')" '$acc + $new')
            has_next=$(echo "$page" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')
            cursor=$(echo "$page" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor')
            [ "$has_next" = "true" ] || break
          done
          response=$(jq -n --argjson nodes "$all_nodes" '{data:{repository:{pullRequest:{reviewThreads:{nodes:$nodes}}}}}')
          # Strict-pure baseline: unresolved threads that existed (first comment predates
          # SINCE) with EVERY comment authored by Codex or this workflow's own auto-resolve
          # reply.
          echo "$response" | jq --arg since "$SINCE" '
            [.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].createdAt < $since)
              | select([.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions"))
              | .id]' > /tmp/baseline-pure.json
          # Broader "initiated" baseline: unresolved threads whose first comment is Codex
          # and predates SINCE, regardless of who replied since.
          echo "$response" | jq --arg since "$SINCE" '
            [.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].author.login == "chatgpt-codex-connector")
              | select(.comments.nodes[0].createdAt < $since)
              | .id]' > /tmp/baseline-initiated.json
          {
            echo "baseline_pure<<BASELINE_EOF"
            cat /tmp/baseline-pure.json
            echo "BASELINE_EOF"
            echo "baseline_initiated<<BASELINE_EOF2"
            cat /tmp/baseline-initiated.json
            echo "BASELINE_EOF2"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate whether Codex responded on this revision
        id: verdict
        if: steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          SINCE: ${{ steps.request-comment.outputs.run_started }}
          COMMENT_ID: ${{ steps.request-comment.outputs.comment_node_id }}
          # A thumbs-up reaction carries no body text, so unlike comment_head_tied/
          # error_head_tied (which verify HEAD_SHA is embedded in the comment body itself)
          # there is no way to confirm a reaction on COMMENT_ID actually answers the
          # CURRENT head -- only that COMMENT_ID is itself the current head's own genuine
          # request comment. is_marked already verifies exactly that (the selected comment
          # is paired with a marker embedding this exact HEAD_SHA, computed fresh above).
          IS_MARKED: ${{ steps.request-comment.outputs.is_marked }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: |
          set -o pipefail
          # A pull_request_review_comment (a reply Codex posted INSIDE an existing review
          # thread) is already thread-scoped by definition -- unlike a bare issue comment,
          # there's no ambiguity to resolve via reviewed_commit_prefix/is_error_shaped
          # matching, and the query below only covers issue-level comments/reviews/
          # reactions anyway (review-thread replies live in a separate GraphQL shape,
          # reviewThreads, which compute-verdict below already re-reads live regardless of
          # what triggered this run).
          #
          # Codex P1, this PR's own round 3: unconditionally trusting arrival of THIS
          # event type was wrong -- pr-context resolves HEAD_SHA and SINCE (RUN_STARTED)
          # from the PR's own LIVE, CURRENT state, not from this specific event's own
          # payload. A stale reply event for an OLD head (A) can fire its Actions run
          # AFTER a NEWER push (B) already landed and got its own fresh request -- pr-context
          # then captures B, but the OLD reply predates B's own RUN_STARTED, so
          # compute-verdict's restated_by_codex check (createdAt >= $since) correctly
          # ignores it -- yet responded=true was still set from the mere fact this run
          # fired at all, letting the check conclude B "clean" with zero genuine evidence
          # Codex ever looked at B. Require the event's OWN comment timestamp to be at or
          # after SINCE before treating it as evidence for the CURRENT request -- exactly
          # the same bar comment_head_tied/reviews already apply via their own `>= $since`
          # filters.
          if [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            if [ -n "$EVENT_COMMENT_CREATED_AT" ] && [ "$(date -u -d "$EVENT_COMMENT_CREATED_AT" +%s)" -ge "$(date -u -d "$SINCE" +%s)" ]; then
              echo "Codex posted a reply within an existing review thread, at or after this request's own start -- routing to compute-verdict for a live re-evaluation."
              echo "responded=true" >> "$GITHUB_OUTPUT"
            else
              echo "This reply ($EVENT_COMMENT_CREATED_AT) predates the current request ($SINCE) -- a newer push has already superseded it. Leaving the check in_progress for the current request's own signal."
              echo "responded=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          owner="${REPO%%/*}"; name="${REPO##*/}"
          HAS_COMMENT="false"
          [ -n "$COMMENT_ID" ] && HAS_COMMENT="true"
          # This combined-query shape (comments/reviews/reactions + a specific commentNode
          # lookup for the request comment's own reactions), the is_error_shaped regex,
          # and reviewed_commit_prefix parsing all originate from propagation's OWN prior
          # wait-for-codex.yml, translated here from a 20s poll loop into a single
          # per-event evaluation -- see this repo's own git history (pre-HAG-82) for the
          # original polling version and its own accumulated fixes (skimmer#45,
          # widdershins#114, this repo's own #53/#69, pancetta#239/#362 for the specific
          # comment-shape and error-shape findings).
          if ! poll=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!, $hasComment: Boolean!, $commentId: ID!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  comments(last: 50) { nodes { author { login } body createdAt } }
                  reviews(last: 50) { nodes { author { login } commit { oid } submittedAt } }
                  reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                }
              }
              commentNode: node(id: $commentId) @include(if: $hasComment) {
                ... on IssueComment {
                  reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                }
              }
            }' -f owner="$owner" -f name="$name" -F pr="$PR" -F hasComment="$HAS_COMMENT" -f commentId="${COMMENT_ID:-placeholder}" \
            2>/tmp/poll-err.log \
            | jq --arg since "$SINCE" --arg sha "$HEAD_SHA" '
              def is_error_shaped: test("(you exceeded your current quota|quota exceeded|rate limit reached|rate.?limit exceeded|unable to (access|start|review)|cannot access|authentication (failed|error)|workspace error|failed to (access|clone|start)|create a codex account and connect|something went wrong)"; "i");
              def reviewed_commit_prefix: try (.body | capture("[Rr]eviewed commit:?\\**\\s*`(?<c>[0-9a-f]{7,40})`").c) catch null;
              def is_codex_bot: . == "chatgpt-codex-connector" or . == "chatgpt-codex-connector[bot]";
              .data.repository.pullRequest as $p
              | ([$p.comments.nodes[] | select(.author.login=="chatgpt-codex-connector" and .createdAt >= $since)]) as $fresh_comments
              | {
                  comment_head_tied: ([$fresh_comments[]
                    | select(.body | is_error_shaped | not)
                    | select((reviewed_commit_prefix // "") as $c | $c != "" and ($sha | startswith($c)))
                  ] | length),
                  # An error-shaped comment whose own body embeds this exact HEAD_SHA is as
                  # tightly scoped to "this request" as comment_head_tied is for a success --
                  # the Codex ref-not-found error embeds the full SHA verbatim, so this can
                  # never be a stale unrelated error (HAG-36, originally found live on
                  # pancetta#362: this exact error repeated twice 71 minutes apart for the
                  # same SHA, and a check without this field silently waited out the full
                  # timeout instead of failing fast on it).
                  error_head_tied: ([$fresh_comments[] | select(.body | is_error_shaped) | select(.body | contains($sha))] | length),
                  reviews: ([$p.reviews.nodes[] | select(.author.login=="chatgpt-codex-connector" and .commit.oid==$sha and .submittedAt >= $since)] | length),
                  comment_thumbsup: ([(.data.commentNode.reactions.nodes // [])[] | select(.user.login | is_codex_bot) | select(.createdAt >= $since)] | length)
                }'); then
            echo "::error::Error querying for a Codex signal: $(cat /tmp/poll-err.log 2>/dev/null)"
            exit 1
          fi
          reviews=$(echo "$poll" | jq '.reviews')
          comment_thumbsup=$(echo "$poll" | jq '.comment_thumbsup')
          comment_head_tied=$(echo "$poll" | jq '.comment_head_tied')
          error_head_tied=$(echo "$poll" | jq '.error_head_tied')
          tied_thumbsup=0
          [ "$comment_thumbsup" -gt 0 ] && [ "$IS_MARKED" = "true" ] && tied_thumbsup=1
          # This job only exists because a real event already fired -- use ONLY signals
          # provably tied to this exact request/head. Requiring a tied signal
          # unconditionally (rather than propagation's own prior file's looser untied-
          # comment/reaction fallback for a first-ever "opened" review) is pancetta's
          # HAG-80 own, more conservative, more recently reviewed design -- kept here
          # deliberately rather than reintroducing the looser branch.
          if [ "$reviews" -gt 0 ] || [ "$tied_thumbsup" -gt 0 ] || [ "$comment_head_tied" -gt 0 ]; then
            echo "Codex responded on this revision: reviews=$reviews comment_thumbsup=$comment_thumbsup (tied=$tied_thumbsup, is_marked=$IS_MARKED) comment_head_tied=$comment_head_tied"
            echo "responded=true" >> "$GITHUB_OUTPUT"
          elif [ "$error_head_tied" -gt 0 ]; then
            echo "::error::Codex reported an error for this exact revision ($HEAD_SHA) instead of reviewing it."
            echo "responded=true" >> "$GITHUB_OUTPUT"
            echo "codex_errored=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tied Codex signal found for $HEAD_SHA in this event -- leaving the check in_progress for the next event or the timeout backstop."
            echo "responded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-check the live head immediately before mutating threads
        id: freshness-check
        # Request and response run in SEPARATE concurrency groups
        # (codex-review-request-<PR> vs codex-review-response-<PR>), so a `synchronize`
        # push landing after pr-context captured HEAD_SHA (but before this point) never
        # cancels this run, unlike the old single-workflow design's one shared PR-wide
        # group. Without this re-check, a long-running baseline/verdict computation could
        # still reach the thread-mutation step below and auto-resolve PR-GLOBAL review
        # threads (not scoped to any one commit) using a since-superseded head. Re-reading
        # live, right before mutating, closes the window rather than widening the
        # concurrency group -- cancel-in-progress: false on this job is deliberate (an
        # in-flight thread-resolution loop must finish cleanly, not be killed
        # mid-mutation), so a shared cancellation domain isn't the right fix (pancetta
        # HAG-80 round 17).
        if: steps.head-check.outputs.stale != 'true' && steps.verdict.outputs.responded == 'true' && steps.verdict.outputs.codex_errored != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          CAPTURED_HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
        run: |
          CURRENT_HEAD_SHA=""
          for _ in 1 2 3; do
            CURRENT_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha' 2>/tmp/freshness-err.log) && break
            echo "::warning::Transient error re-checking PR head -- retrying in 5s: $(cat /tmp/freshness-err.log)"
            sleep 5
          done
          if [ -z "$CURRENT_HEAD_SHA" ]; then
            echo "::warning::Could not re-verify PR #$PR's live head after 3 attempts -- failing open (proceeding with the originally captured head) rather than blocking this response indefinitely: $(cat /tmp/freshness-err.log)"
            exit 0
          fi
          if [ "$CAPTURED_HEAD_SHA" != "$CURRENT_HEAD_SHA" ]; then
            echo "::notice::PR #$PR's head advanced from $CAPTURED_HEAD_SHA to $CURRENT_HEAD_SHA while this response was being computed -- skipping thread mutation as superseded. The new head's own request/response cycle supersedes this one."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the verdict and auto-resolve eligible threads
        id: compute-verdict
        if: steps.head-check.outputs.stale != 'true' && steps.verdict.outputs.responded == 'true' && steps.verdict.outputs.codex_errored != 'true' && steps.freshness-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          RUN_STARTED: ${{ steps.request-comment.outputs.run_started }}
          IS_MARKED: ${{ steps.request-comment.outputs.is_marked }}
          TRUSTED_LOGIN: ${{ steps.request-comment.outputs.trusted_login }}
        run: |
          set -o pipefail
          # Read back the durable marker the request job posts: if more than one
          # "<!-- codex-review-request head_sha=$HEAD_SHA -->" comment exists for this
          # EXACT head_sha, this round is a re-request of unchanged code, not a genuine
          # new commit. HEAD_SHA is a git SHA (safe hex characters only) -- interpolated
          # directly into the filter string rather than via --arg, since `gh api --jq`
          # (distinct from real jq) has no --arg companion flag at all. --paginate, piped
          # into a separate `jq -s`, not `gh api`'s own --jq: a PR with more than 100
          # comments would otherwise only see the first page. Restricted to TRUSTED_LOGIN
          # (the identity behind CODEX_REVIEW_PAT, resolved once in "Find the most recent
          # request comment") -- without this, anyone able to comment could forge this
          # exact marker text on an unchanged head_sha to make it read as genuinely
          # re-synced.
          marker_count=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            | jq -s --arg login "$TRUSTED_LOGIN" "[.[][] | select(.body == \"<!-- codex-review-request head_sha=$HEAD_SHA -->\") | select(\$login != \"\" and .user.login == \$login)] | length")
          # IS_MARKED (computed by "Find the most recent request comment" above)
          # additionally requires the SELECTED "@codex review" comment itself to be paired
          # with a marker -- a bare manual re-request has no marker at all, so marker_count
          # alone would still read "1" and wrongly classify it as genuine.
          IS_GENUINE_SYNC=true
          [ "$marker_count" -gt 1 ] && IS_GENUINE_SYNC=false
          [ "$IS_MARKED" != "true" ] && IS_GENUINE_SYNC=false
          echo "Found $marker_count request marker(s) for $HEAD_SHA, selected request is_marked=$IS_MARKED -- IS_GENUINE_SYNC=$IS_GENUINE_SYNC"

          # SHA-scoped label name, 3-attempt retry with 5s backoff, `gh label create`
          # (idempotent, `|| true`) before the attach POST -- propagation's own established
          # design, carried forward unchanged from its old wait-for-codex.yml. Never
          # deletes a stale/older label (cosmetic clutter, not a bug). Deliberately
          # fail-open (the caller wraps every call in `|| true`): ci.yml's own
          # codex-clean job independently polls for this label for up to 150 minutes and
          # fails loudly itself if it never appears, so a transient failure to apply it
          # here does not need to also fail THIS check red -- that would be double
          # jeopardy for one transient blip.
          apply_clean_label() {
            local label="codex-clean:${HEAD_SHA:0:12}"
            for _ in 1 2 3; do
              gh label create "$label" --color 0e8a16 \
                --description "This revision's Codex round raised nothing new -- safe to run the gated jobs" \
                --repo "$REPO" >/dev/null 2>&1 || true
              if gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$label" >/dev/null 2>&1; then
                echo "Applied $label."
                return 0
              fi
              sleep 5
            done
            echo "::warning::Could not apply $label after 3 attempts -- ci.yml's own codex-clean poll will wait out its own timeout instead."
            return 1
          }

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          baseline='${{ steps.baseline.outputs.baseline_pure }}'
          baseline_initiated='${{ steps.baseline.outputs.baseline_initiated }}'
          [ -z "$baseline" ] && baseline='[]'
          [ -z "$baseline_initiated" ] && baseline_initiated='[]'

          # Same fixed-page gap as the baseline query above -- a thread past the 100th is
          # invisible to new_count/restated_count, so a real new or still-live finding on
          # a heavily-discussed PR can silently read as clean.
          all_nodes="[]"
          cursor="null"
          while true; do
            page=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $pr: Int!, $after: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        isResolved
                        path
                        comments(first: 50) { nodes { author { login } createdAt originalCommit { oid } } }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -F after="$cursor")
            all_nodes=$(jq -n --argjson acc "$all_nodes" --argjson new "$(echo "$page" | jq '.data.repository.pullRequest.reviewThreads.nodes')" '$acc + $new')
            has_next=$(echo "$page" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')
            cursor=$(echo "$page" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor')
            [ "$has_next" = "true" ] || break
          done
          result=$(jq -n --argjson nodes "$all_nodes" '{data:{repository:{pullRequest:{reviewThreads:{nodes:$nodes}}}}}' \
            | jq --argjson baseline "$baseline" --argjson baselineInitiated "$baseline_initiated" --arg since "$RUN_STARTED" '
              def ignorable_author: . == "chatgpt-codex-connector" or . == "github-actions";
              def codex_initiated: (.comments.nodes[0].author.login == "chatgpt-codex-connector");
              def restated_by_codex:
                [.comments.nodes[] | select(.author.login == "chatgpt-codex-connector" and .createdAt >= $since)] | length > 0;
              .data.repository.pullRequest.reviewThreads.nodes as $nodes
              | ($nodes
                  | map(select(.isResolved == false)
                        | select(codex_initiated)
                        | .id)) as $codex_unresolved
              | {
                  new_count: (($codex_unresolved - $baselineInitiated) | length),
                  restated_count: ([$nodes[]
                    | select(.isResolved == false)
                    | select(codex_initiated)
                    | select(.id as $id | $baselineInitiated | index($id))
                    | select(restated_by_codex)
                  ] | length),
                  unresolved_baseline_count: ([$codex_unresolved[] | select(. as $id | $baselineInitiated | index($id))] | length),
                  resolvable: [
                    $nodes[]
                    | select(.isResolved == false)
                    | select(.id as $id | $baseline | index($id))
                    | select([.comments.nodes[].author.login] | all(ignorable_author))
                    | select([.comments.nodes[] | select(.createdAt >= $since)] | length == 0)
                    | {id, path, findingSha: (.comments.nodes[0].originalCommit.oid // "")}
                  ]
                }')

          new_count=$(echo "$result" | jq '.new_count')
          restated_count=$(echo "$result" | jq '.restated_count')
          unresolved_baseline_count=$(echo "$result" | jq '.unresolved_baseline_count')

          if [ "$new_count" -gt 0 ]; then
            echo "::error::Codex raised $new_count new concern(s) on this revision — resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$restated_count" -gt 0 ]; then
            echo "::error::Codex restated $restated_count still-live concern(s) in an existing thread on this revision — resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_GENUINE_SYNC" != "true" ] && [ "$unresolved_baseline_count" -gt 0 ]; then
            echo "::error::This is a rerun with $unresolved_baseline_count still-unresolved baseline concern(s) that nothing here will clear — resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          apply_clean_label || true
          echo "outcome=success" >> "$GITHUB_OUTPUT"

          if [ "$IS_GENUINE_SYNC" != "true" ]; then
            echo "This round is a rerun, not a genuine synchronize — the code hasn't changed, so not auto-resolving baseline threads that may still describe it."
            exit 0
          fi

          echo "$result" | jq -r '.resolvable[] | [.id, .path, .findingSha] | @tsv' | while IFS=$'\t' read -r thread_id path finding_sha; do
            [ -z "$thread_id" ] && continue
            # Codex P1, this PR's own round 2: the freshness-check step above only
            # verifies the head ONCE, right before this loop starts -- but a PR with many
            # resolvable threads can keep this loop running for a while (each iteration
            # does a compare-API call plus two live thread-state rechecks), and a
            # synchronize/force-push landing mid-loop would otherwise go undetected. The
            # per-thread live-state recheck further below verifies the THREAD's own
            # resolved/purity/freshness state, but never re-verifies that HEAD_SHA is
            # still the PR's actual current head -- a thread could pass every one of
            # those checks and still get resolved with a reply claiming "Codex re-reviewed
            # commit $HEAD_SHA" against a commit that's no longer current, potentially
            # resolving a finding the NEW head reintroduced. Re-verified here, once per
            # iteration; `break` (not `continue`) once detected, since every remaining
            # thread in this same loop is equally stale from this point on -- no need to
            # burn further API calls re-discovering the same fact per thread.
            LIVE_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha' 2>/tmp/loop-freshness-err.log || echo "")
            if [ -z "$LIVE_HEAD_SHA" ]; then
              echo "::warning::Could not re-verify PR #$PR's live head mid-loop -- continuing with the originally captured head rather than aborting a partially-completed auto-resolve pass: $(cat /tmp/loop-freshness-err.log 2>/dev/null)"
            elif [ "$LIVE_HEAD_SHA" != "$HEAD_SHA" ]; then
              echo "::notice::PR #$PR's head advanced from $HEAD_SHA to $LIVE_HEAD_SHA mid-loop -- stopping auto-resolve here. Remaining threads stay unresolved for the new head's own request/response cycle to re-evaluate."
              break
            fi
            if [ -z "$finding_sha" ]; then
              echo "::warning::Thread $thread_id has no recorded originating commit — leaving unresolved."
              continue
            fi
            if ! compare_response=$(gh api "repos/$REPO/compare/$finding_sha...$HEAD_SHA" 2>/tmp/compare-err.log); then
              echo "::warning::Could not compare $finding_sha...$HEAD_SHA for thread $thread_id — leaving unresolved: $(cat /tmp/compare-err.log 2>/dev/null)"
              continue
            fi
            merge_base=$(echo "$compare_response" | jq -r '.merge_base_commit.sha // ""')
            if [ "$merge_base" != "$finding_sha" ]; then
              echo "::warning::$finding_sha is not an ancestor of $HEAD_SHA (merge base: ${merge_base:-none}) — leaving thread $thread_id unresolved: $path"
              continue
            fi
            compare_files=$(echo "$compare_response" | jq '[.files[]? | (.filename, (.previous_filename // empty))]')
            if ! echo "$compare_files" | jq -e --arg path "$path" 'any(. == $path)' >/dev/null; then
              echo "Skipping thread $thread_id — flagged file '$path' was not touched by any commit since the finding was raised."
              continue
            fi
            if ! live=$(gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequestReviewThread {
                    isResolved
                    comments(first: 50) { nodes { author { login } createdAt } }
                  }
                }
              }' -f id="$thread_id" 2>/tmp/live-recheck-err.log); then
              echo "::warning::Could not re-check thread $thread_id live state — leaving unresolved: $(cat /tmp/live-recheck-err.log 2>/dev/null)"
              continue
            fi
            live_resolved=$(echo "$live" | jq -r '.data.node.isResolved')
            live_pure=$(echo "$live" | jq '[.data.node.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions")')
            live_fresh=$(echo "$live" | jq --arg since "$RUN_STARTED" '[.data.node.comments.nodes[] | select(.createdAt >= $since)] | length == 0')
            if [ "$live_resolved" != "false" ] || [ "$live_pure" != "true" ] || [ "$live_fresh" != "true" ]; then
              echo "Skipping thread $thread_id — no longer eligible."
              continue
            fi
            pre_reply_count=$(echo "$live" | jq '.data.node.comments.nodes | length')
            if ! gh api graphql -f query='
              mutation($id: ID!, $body: String!) {
                addPullRequestReviewThreadReply(input: {pullRequestReviewThreadId: $id, body: $body}) {
                  comment { id }
                }
              }' -f id="$thread_id" -f body="Auto-resolved: Codex re-reviewed commit $HEAD_SHA after this push and raised no new concerns." 2>/tmp/reply-err.log; then
              echo "::warning::Could not reply to thread $thread_id — leaving unresolved: $(cat /tmp/reply-err.log)"
              continue
            fi
            if ! live2=$(gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequestReviewThread {
                    isResolved
                    comments(first: 50) { nodes { author { login } } }
                  }
                }
              }' -f id="$thread_id" 2>/tmp/live-recheck2-err.log); then
              echo "::warning::Could not re-verify thread $thread_id before resolving — leaving unresolved: $(cat /tmp/live-recheck2-err.log 2>/dev/null)"
              continue
            fi
            post_reply_resolved=$(echo "$live2" | jq -r '.data.node.isResolved')
            post_reply_pure=$(echo "$live2" | jq '[.data.node.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions")')
            post_reply_count=$(echo "$live2" | jq '.data.node.comments.nodes | length')
            if [ "$post_reply_resolved" != "false" ] || [ "$post_reply_pure" != "true" ] || [ "$post_reply_count" -ne "$((pre_reply_count + 1))" ]; then
              echo "::warning::Thread $thread_id changed between reply and resolve — leaving unresolved (has a reply, but not auto-resolved)."
              continue
            fi
            # GITHUB_TOKEN (github-actions[bot]) reliably fails resolveReviewThread on a
            # bot-started thread with "Resource not accessible by integration" -- confirmed
            # live on pancetta's own PR #239, 10/10 resolve attempts failed this way even
            # though the reply above succeeded every time. RESOLVE_TOKEN (a real-user PAT)
            # does not have this restriction.
            if ! GH_TOKEN="$RESOLVE_TOKEN" gh api graphql -f query='
              mutation($id: ID!) {
                resolveReviewThread(input: {threadId: $id}) {
                  thread { isResolved }
                }
              }' -f id="$thread_id" 2>/tmp/resolve-err.log; then
              echo "::warning::Could not resolve thread $thread_id (left a reply; may need manual resolution): $(cat /tmp/resolve-err.log)"
              continue
            fi
            echo "Auto-resolved thread $thread_id"
          done

      - name: Update the check-run
        # freshness-check's own `stale` output must also gate this step (not just
        # compute-verdict): without it, a stale head would leave $OUTCOME empty (compute-
        # verdict skipped, codex_errored not set either) and conclude_check below would
        # misread that as a real failure -- PATCHing the check-run to "Codex raised new
        # concerns" and removing its clean label for a head_sha nothing was actually wrong
        # with, purely because this run lost a race with a newer push.
        if: always() && steps.head-check.outputs.stale != 'true' && steps.verdict.outputs.responded == 'true' && steps.freshness-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          # A genuine Codex error (codex_errored) counts as a failed outcome even though
          # compute-verdict never ran to compute one.
          OUTCOME: ${{ steps.verdict.outputs.codex_errored == 'true' && 'failure' || steps.compute-verdict.outputs.outcome }}
        run: |
          # Same numeric-external_id filter as upsert_check_run's own lookup -- excludes
          # GitHub's native per-job "skipped" check-run (a UUID external_id) from ever being
          # selected as the real, hagale-agent-managed check-run to PATCH here.
          check_id=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            | jq -s '[.[].check_runs[] | select(.name == "Codex review clean (gate before expensive downstream jobs)") | select((.external_id // "") | test("^[0-9]+$"))] | sort_by(.started_at) | last | .id // empty')

          # If this exact head_sha PREVIOUSLY passed (apply_clean_label applied a label for
          # it), then a LATER response on the SAME head_sha (a rerun, or a reopen) finds a
          # genuine new/restated concern, that earlier label still sits on the PR untouched
          # -- apply_clean_label only ever ADDS it, nothing removes it. The producer job's
          # "Self-heal: does the codex-clean label already exist" step treats ANY existing
          # label for this head as authoritative and skips straight to success without
          # requesting a fresh round -- reviving a since-failed gate from stale data.
          # Remove the label whenever THIS conclusion is failure (covers every failure
          # path, including the codex_errored one which never goes through compute-verdict
          # at all), so a later producer run for this SAME head_sha correctly finds no
          # label and proceeds with a real evaluation.
          #
          # Retries (a transient failure is far more likely to be the cause than a
          # permanent one), and requires either genuine success or a confirmed 404 (the
          # label was never there, or something else already removed it) before treating
          # removal as complete -- an unconditional `|| true` here would discard a genuine
          # permission problem alongside the expected "already gone" case, leaving the
          # stale-label revival risk in place with a false sense of having fixed it.
          remove_clean_label() {
            local label="codex-clean:${HEAD_SHA:0:12}"
            local err_file
            for attempt in 1 2 3; do
              err_file="$(mktemp)"
              if gh api -X DELETE "repos/$REPO/issues/$PR/labels/$label" >/dev/null 2>"$err_file"; then
                return 0
              fi
              if grep -qi "does not exist\|not found" "$err_file"; then
                return 0
              fi
              echo "::warning::Failed to remove $label (attempt $attempt): $(cat "$err_file")" >&2
              sleep 2
            done
            echo "::error::Could not confirm removal of $label after 3 attempts -- it may still exist and could wrongly revive this failed gate on a later rerun. Remove it manually if this recurs." >&2
            return 1
          }

          conclude_check() {
            local conclusion="$1"
            # This whole script runs under bash -e (GitHub Actions' own default shell for
            # run: steps). `[ cond ] && cmd` where `cmd` (remove_clean_label) can
            # legitimately return 1 after exhausting its own retries is a bare top-level
            # statement, not the CONDITION of an if/while -- under errexit that non-zero
            # exit aborts THIS SCRIPT immediately, so conclude_check's own PATCH/POST below
            # never runs at all when label removal fails. Wrapped in a real `if` with an
            # explicit `|| true` inside it, which fully neutralizes errexit for this call
            # regardless of what remove_clean_label itself returns (pancetta HAG-80 round
            # 14).
            if [ "$conclusion" != "success" ]; then
              remove_clean_label || true
            fi
            if [ -n "$check_id" ]; then
              for attempt in 1 2 3; do
                if [ "$conclusion" = "success" ]; then
                  gh api -X PATCH "repos/$REPO/check-runs/$check_id" -f status="completed" -f conclusion="success" && return 0
                else
                  gh api -X PATCH "repos/$REPO/check-runs/$check_id" \
                    -f status="completed" -f conclusion="failure" \
                    -f output[title]="Codex raised new concerns" \
                    -f output[summary]="See this job's log for details -- resolve or ticket them, then push a remediation commit to trigger a fresh re-review." && return 0
                fi
                sleep 2
              done
              echo "::warning::failed to conclude check-run $check_id after 3 attempts" >&2
              return 1
            fi
            # If the request job's create-check step never ran or never produced a
            # check-run at all, warning and doing nothing leaves the required check
            # permanently absent for this head_sha. Create it directly instead.
            echo "::warning::No matching check-run found for $HEAD_SHA -- creating one directly with this outcome."
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Codex review clean (gate before expensive downstream jobs)" -f head_sha="$HEAD_SHA" \
              -f status="completed" -f conclusion="$conclusion" -f external_id="$RUN_ID" \
              || { echo "::warning::failed to publish a fallback check-run for $HEAD_SHA" >&2; return 1; }
          }

          # This repo's downstream gate (ci.yml's codex-clean job, polling for the
          # codex-clean label) already has its OWN independent 150-minute timeout and
          # fails loudly on its own if the label never appears. Concluding this check
          # "success" here does not need to be gated on the label-apply step (already
          # fail-open, above) succeeding.
          conclude_check "$OUTCOME"
